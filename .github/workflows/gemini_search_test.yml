name: Gemini search test (ek baar)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - name: Har model par google_search ek baar
        env:
          K1: ${{ secrets.GEMINI_API_KEY }}
          K2: ${{ secrets.GEMINI_API_KEY2 }}
          K3: ${{ secrets.GEMINI_API_KEY3 }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          base = "https://generativelanguage.googleapis.com/v1beta/models"
          for kn in ("K1", "K2", "K3"):
              k = os.environ[kn].strip()
              for n in ("gemini-3.8-flash", "gemini-3.5-flash-lite"):
                  for search in (False, True):
                      b = {"contents":[{"parts":[{"text":"Current Speed Post tariff 50 g local India? One line."}]}]}
                      if search: b["tools"] = [{"google_search":{}}]
                      try:
                          r = urllib.request.urlopen(urllib.request.Request(f"{base}/{n}:generateContent?key={k}", json.dumps(b).encode(), {"Content-Type":"application/json"}), timeout=90)
                          print(kn, n, "search" if search else "plain", "OK")
                      except urllib.error.HTTPError as e:
                          err = json.loads(e.read() or b"{}").get("error", {})
                          det = json.dumps(err.get("details", []))[:300]
                          print(kn, n, "search" if search else "plain", e.code, det)
          PY
