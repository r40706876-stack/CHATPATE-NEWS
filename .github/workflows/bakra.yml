# Production: 07:00, 10:00, 13:00, 16:00, 19:00 Asia/Kolkata.
name: bakra-news
on:
  schedule:
    - cron: "30 1,4,7,10,13 * * *"
  push:
    branches: [main]
    paths: ["production_request.json"]
  workflow_dispatch:
    inputs:
      mode:
        description: "direct = scheduled-slot news video; check/write = manual script tools"
        type: choice
        options: [direct, check, write]
        default: direct
concurrency:
  group: bakra-news-production
  cancel-in-progress: false
env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
  GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  YT_COOKIES: ${{ secrets.YT_COOKIES }}
  SCHEDULED_ONLY: "1"
  GEMINI_REQUEST_BUDGET: "24"
  GEMINI_MODELS_PER_KEY: "3"
  DD: "0"
  SCENES: "0"
  SCENE_GEMINI: "0"
jobs:
  reel:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[bakra-slot-recovery]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions: {contents: write, actions: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Prepare one cached production slot
        env:
          MODE: ${{ inputs.mode || 'direct' }}
        run: |
          set -euo pipefail
          python -c 'import gemini; print("Gemini keys configured:", len(gemini.keys()))'
          if [ "$MODE" = "direct" ]; then
            python scheduled_production.py
          else
            python run_daily.py "$MODE"
          fi
      - name: Save script before dispatch
        if: always()
        run: |
          git config user.name bakra-production
          git config user.email bot@users.noreply.github.com
          for path in episodes production_slots news_cache production_error.json done.txt shown.txt last_direct.txt pending.json tg_offset.txt; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Cache scheduled news script and slot state"
            git pull --rebase
            git push
          fi
      - name: Start video from prepared script
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          if [ ! -s studio_job.txt ]; then
            echo "No new job: slot already running/delivered, or manual script-only mode."
            exit 0
          fi
          job=$(cat studio_job.txt)
          test -f "$job"
          gh workflow run talk_episode.yml --ref main -f script="$job"
          slot=$(python -c 'import scheduled_production as s; print(s.slot_for() or "")')
          if [ -n "$slot" ]; then
            python scheduled_production.py dispatched "$slot"
            git add production_slots
            git commit -m "Mark scheduled slot dispatched"
            git pull --rebase
            git push
          fi
      - name: Report production failure
        if: failure()
        run: |
          python -c 'import telegram, scheduled_production as s; telegram.send_text(s.failure_message("https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"))'
