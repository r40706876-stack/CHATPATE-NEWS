# बकरा न्यूज़ (काम की खबर, देसी अंदाज़) — रोज़ 2 बार (~8:30 सुबह, ~7:15 शाम IST) 3 scripts Telegram पर.
# तुम 1 / 2 / 3 भेजो (0 = तीनों नई) → हर 15 मिनट पर check होता है → video Telegram पर.
# Secrets: GEMINI_API_KEY (+ GEMINI_API_KEY2 जब पहली का कोटा ख़त्म हो), TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
name: bakra-news
on:
  schedule:
    - cron: "55 2 * * *"     # scripts लिखो (सुबह ~8:30 IST)
    - cron: "44 13 * * *"    # scripts लिखो (शाम ~7:15 IST)
    - cron: "4 15 * * *"     # दिन भर की खबरें (रात ~8:35 IST, सीधे video)
    - cron: "*/15 * * * *"   # तुम्हारा जवाब देखो
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = जवाब देखो / नहीं तो नई scripts | write = अभी 3 नई scripts"
        type: choice
        options: [auto, write, check, bulletin]
        default: auto
concurrency:
  group: bakra          # एक समय में एक ही run (वरना दो run एक ही जवाब पर दो video बना देते)
  cancel-in-progress: false
env:
  MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '4 15 * * *' && 'bulletin' || ((github.event.schedule == '55 2 * * *' || github.event.schedule == '44 13 * * *') && 'write' || 'check')) }}
  MODELS_DIR: models_cache
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
jobs:
  reel:
    runs-on: ubuntu-latest
    permissions: {contents: write, actions: write}
    steps:
      - uses: actions/checkout@v4
      - name: zip kholo (sirf pehli baar)
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          if [ -f bakra_news_final.zip ]; then
            unzip -q -o bakra_news_final.zip
            rsync -a --exclude .github bakra_final/ ./
            rm -rf bakra_final bakra_news_final.zip
            git add -A && git commit -m "files unpack" && git push
          fi
      - name: scripts लिखो / जवाब देखो
        run: |
          set -o pipefail
          python run_daily.py "$MODE" 2>&1 | tee last_run.log
          # GitHub का 15 मिनट वाला schedule अक्सर 1-3 घंटे देर से चलता है — इसलिए scripts भेजने के बाद 40 मिनट तक
          # यहीं हर मिनट तुम्हारा जवाब देखो; नंबर मिलते ही इसी run में video शुरू
          if [ "$MODE" = "write" ] && [ -f pending.json ] && grep -q '"topic"' pending.json; then
            for i in $(seq 1 40); do
              sleep 60
              python run_daily.py check 2>&1 | tee -a last_run.log | grep -v "^$" | tail -2
              [ -f choice.json ] && break
              grep -q '"topic"' pending.json 2>/dev/null || break
            done
          fi

      # ---- नीचे वाले कदम सिर्फ़ तब चलते हैं जब तुमने नंबर चुना हो (choice.json) ----
      - if: hashFiles('choice.json') != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng libraqm0
      - if: hashFiles('choice.json') != ''
        run: pip install numpy scipy pillow onnxruntime
      - if: hashFiles('choice.json') != ''
        name: आवाज़ का model (cache)
        uses: actions/cache@v4
        with: {path: models_cache, key: kokoro-v1}
      - if: hashFiles('choice.json') != ''
        run: |
          mkdir -p models_cache && cd models_cache
          test -f kokoro.int8.onnx || curl -sL -o kokoro.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          test -f voices-v1.0.bin || curl -sL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - if: hashFiles('choice.json') != ''
        name: video बनाओ
        run: python run_daily.py render
      - uses: actions/upload-artifact@v4
        if: hashFiles('out/**/reel.mp4') != ''
        with:
          name: reel
          path: |
            out/*/reel.mp4
            out/*/caption.txt
            out/*/script.json

      - name: याद रखो (pending.json, done.txt, tg_offset.txt)
        if: always()
        run: |
          git add -A
          git add -f last_run.log 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "bakra state ($MODE)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      - name: 3D studio video शुरू करो
        if: hashFiles('studio_job.txt') != ''
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          job=$(cat studio_job.txt)
          git rm -q --cached studio_job.txt 2>/dev/null || true
          rm -f studio_job.txt
          git commit -qm "studio job शुरू" 2>/dev/null && git push -q || true
          gh workflow run talk_episode.yml -f script="$job"
