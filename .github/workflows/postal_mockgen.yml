name: Postal mock ke naye sawal (ganit, GK, Vol V, Paper-II)
# Poore MTS / Postman mock ke liye kami wale hisson ke naye sawal, asli PYQ jaise (deep/mockgen.py).
# Nateeja: core repo branch 'postal-mg' -> mg_done.json. Chaaron Gemini key barabar; chhote daur (90 call/key) taaki
# har ~1 ghante nateeje website par aayein; kaam baaki ho aur pichhle daur me kuch bana ho to khud agla daur.
on:
  schedule:
    - cron: '10 8 * * *'     # 13:40 IST: Gemini ka roz ka quota naya hote hi
    - cron: '40 11 * * *'    # 17:10 IST: dobara (agar beech me ruka ho)
  workflow_dispatch:
    inputs:
      calls:
        description: "har key par kitni AI calls"
        default: "90"
permissions:
  contents: read
  actions: write
concurrency:
  group: postal-mockgen
  cancel-in-progress: false
jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null; pip install -q requests pypdf pillow numpy
      - name: Pichhla padha hua lo
        run: |
          git fetch -q origin postal-mg 2>/dev/null && git show FETCH_HEAD:mg_${{ matrix.shard }}.json > mg_${{ matrix.shard }}.json 2>/dev/null || rm -f mg_${{ matrix.shard }}.json
      - name: Padho
        run: |
          case "${{ matrix.shard }}" in
            0) export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" ;;
            1) export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY2 }}" ;;
            2) export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY3 }}" ;;
            *) export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY4 }}" ;;
          esac
          SHARD=${{ matrix.shard }} NSHARD=4 MG_MAX_CALLS=${{ inputs.calls || '90' }} python deep/mockgen.py mg_${{ matrix.shard }}.json 2>&1 | tail -n 60
          [ -f mg_${{ matrix.shard }}.json ] || echo "{}" > mg_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: mg${{ matrix.shard }}
          path: mg_${{ matrix.shard }}.json

  save:
    needs: ocr
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          path: bk
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: postal-mg branch par rakho
        run: |
          mkdir o && cp dl/mg_*.json o/ && cd o && python3 - <<'PY'
          import json, glob
          t = {}
          for f in sorted(glob.glob("mg_*.json")):
              t.update(json.load(open(f, encoding="utf-8")))
          json.dump(dict(sorted(t.items(), key=lambda kv: kv[0])),
                    open("mg_done.json", "w", encoding="utf-8"), ensure_ascii=False, indent=0)
          print("kul batch:", len(t), "naye sawal:", sum(len(v) for v in t.values()))
          PY
          git init -q && git checkout -q -b postal-mg
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "naye sawal (run ${{ github.run_id }})"
          git remote add origin "$(git -C ../bk remote get-url origin)"
          prev=$(git -C ../bk fetch -q origin postal-mg 2>/dev/null && git -C ../bk show FETCH_HEAD:mg_done.json 2>/dev/null | python3 -c "import json,sys;print(sum(len(v) for v in json.load(sys.stdin).values()))" 2>/dev/null || echo 0)
          now=$(python3 -c "import json;print(sum(len(v) for v in json.load(open('mg_done.json')).values()))")
          tot=8550
          echo "pehle $prev, ab $now, kul $tot"
          if [ "$now" -gt "$prev" ] && [ "$now" -lt "$tot" ]; then echo 1 > ../cont.txt; fi
          git -c http.extraheader="$(git -C ../bk config --get http.https://github.com/.extraheader)" push -qf origin HEAD:postal-mg
      - name: Kaam baaki ho to agla daur khud chalao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run postal_site_refresh.yml -R ${{ github.repository }} || true   # nateeje website par
          if [ -f cont.txt ]; then gh workflow run postal_mockgen.yml -R ${{ github.repository }} -f calls=90 && echo "agla daur shuru"; fi
