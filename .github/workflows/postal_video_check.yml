name: Postal video jaanch (whisper se awaaz vs caption)

on:
  workflow_dispatch:
    inputs:
      branch:
        default: "postal-deep-out"
      file:
        default: "clause7_auto.mp4"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: v
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -q faster-whisper
          ffmpeg -v error -y -i "v/${{ inputs.file }}" -ac 1 -ar 16000 a.wav
          python - <<'PY'
          import json
          from faster_whisper import WhisperModel
          m = WhisperModel("medium", device="cpu", compute_type="int8")
          segs, _ = m.transcribe("a.wav", language="hi", word_timestamps=True, vad_filter=False, beam_size=5,
                                 initial_prompt="डाकघर, RMS, नाइट पोस्ट ऑफिस, लेट फीस, फ्रैंक, रजिस्टर्ड अखबार, तार शाखा")
          out = [{"s": round(s.start, 2), "e": round(s.end, 2), "t": s.text.strip(),
                  "w": [[round(w.start, 2), round(w.end, 2), w.word] for w in (s.words or [])]} for s in segs]
          json.dump(out, open("check.json", "w"), ensure_ascii=False, indent=0)
          for s in out: print(f'{s["s"]:7.2f} {s["e"]:7.2f}  {s["t"]}')
          PY
      - run: |
          mkdir -p /tmp/o && cp check.json /tmp/o/ && cd /tmp/o && git init -q && git checkout -q -b postal-deep-check
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "whisper check ${{ inputs.file }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" postal-deep-check:postal-deep-check
