name: Postal Edge transfer reel final motion check
on:
  push:
    branches: ['preview/postal-edge-transfer-hook-4s']
    paths: ['.github/workflows/postal_transfer_motion_final.yml']
permissions:
  contents: read
  actions: read
jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Wait for the motion cut
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 80); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45051834820" --jq .status)
            if [ "$state" = completed ]; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45051834820" --jq .conclusion)" = success
              exit $?
            fi
            sleep 6
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45051834820
          name: Postal_Edge_Transfer_Motion_Final
          path: previous
      - name: Bring the travel captions in front of the character
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          echo '' | base64 --decode > before.png
          echo '' | base64 --decode > after.png
          mkdir final
          ffmpeg -v error -y -i previous/Postal_Edge_GDS_Transfer_Postman_Draft.mp4 -i before.png -i after.png \
            -filter_complex "[0:v][1:v]overlay=48:896:enable='gte(t,5.5)*lt(t,8.3)'[first];[first][2:v]overlay=48:896:enable='gte(t,8.3)*lt(t,11.433333)'[v]" \
            -map '[v]' -map 0:a:0 -c:v libx264 -preset veryfast -crf 16 -fps_mode passthrough -c:a copy -movflags +faststart final/Postal_Edge_GDS_Transfer_Postman_Draft.mp4
          ffmpeg -v error -xerror -i final/Postal_Edge_GDS_Transfer_Postman_Draft.mp4 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: Postal_Edge_Transfer_Motion_Checked
          path: final/Postal_Edge_GDS_Transfer_Postman_Draft.mp4
          if-no-files-found: error
          retention-days: 14
