name: Postal purani branch saaf (ek baar)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          CT: ${{ secrets.CORE_TOKEN }}
          R: ${{ github.repository }}
        run: |
          CORE="https://x-access-token:${CT}@github.com/r40706876-stack/postal-wala-core.git"
          for b in postal-pyq-out postal-ip postal-deep-out postal-deep-out_board postal-deep-out_safar postal-deep-check postal-notes-out; do
            B=$(git ls-remote "https://github.com/$R.git" "refs/heads/$b" | cut -f1)
            C=$(git ls-remote "$CORE" "refs/heads/bakra-backup/$b" | cut -f1)
            if [ -z "$B" ]; then echo "pehle se nahi: $b"; continue; fi
            if [ "$B" = "$C" ]; then
              gh api -X DELETE "repos/$R/git/refs/heads/$b" && echo "HATAYA $b ($B core me pakka)"
            else
              echo "!!! RUKA $b: Bakra=$B core-backup=$C (match nahi)"
            fi
          done
