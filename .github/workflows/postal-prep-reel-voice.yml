name: Postal Edge prep Reel voice and lesson assets
run-name: Postal Edge | Prep Reel voice and actual HO SO BO footage
on:
  push:
    branches: [preview/rule3-transfer-2026]
    paths: ['.github/workflows/postal-prep-reel-voice.yml']
permissions:
  contents: read
concurrency:
  group: postal-prep-reel-voice-pickup
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: 212e56242b9fe5797a789d0d56b41bbb2ded0838
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /*.json
            /*.ttf
            /deep/
            /rebrand_reels/rule3_transfer_2026/
            /docs/transfer/
            /docs/icon-192.png
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: 135c9104ca85845e3c11254f8a08102faa86e51c
          path: approved-lesson
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /previews/postal-office-scene-assets.zip
            /previews/postal-edge-full-reel-assets.zip
      - name: Prepare the established speech and video dependencies
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          pip install -q playwright numpy pillow scipy requests edge-tts pypdf
      - name: Collect the actual lesson footage and saved website captures
        run: |
          mkdir -p rule3-preview tmp-lesson
          unzip -oq approved-lesson/previews/postal-edge-full-reel-assets.zip -d tmp-lesson
          unzip -oq approved-lesson/previews/postal-office-scene-assets.zip -d tmp-lesson
          source=$(find tmp-lesson -iname 'lesson.mp4' -print -quit)
          test -n "$source"
          ffmpeg -v error -y -i "$source" -t 36 -vf "scale=720:-2" -c:v libx264 -preset fast -crf 19 -c:a aac -b:a 96k rule3-preview/ho_so_bo_lesson.mp4
          for file in home_top.jpg phone_home.jpg notes.jpg papers.jpg wrong.jpg; do
            cp "rebrand_reels/promo_v2/img/$file" rule3-preview/
          done
      - name: Record Golu and Dakia Bhaiya in the approved voices
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}
        run: |
          python -u - <<'PY'
          import os,sys
          from concurrent.futures import ThreadPoolExecutor
          sys.path.insert(0,"rebrand_reels/rule3_transfer_2026")
          from render_preview import record_voice
          keys=list(dict.fromkeys(os.environ[key] for key in ("GEMINI_API_KEY4","GEMINI_API_KEY3","GEMINI_API_KEY2","GEMINI_API_KEY") if os.environ.get(key)))
          if not keys:
              raise SystemExit("Approved voice engine unavailable")
          record_voice("g", [
              ("ghook", "एच ओ, एस ओ, बी ओ में फ़र्क? ये देखो!"),
              ("gmock", "तो पढ़ने के बाद मॉक भी लगा सकते हैं?"),
          ], keys)
          record_voice("d", [
              ("dclass", "हाँ, ऐसी फ्री डेमो क्लास में चित्रों से नियम समझो।"),
              ("dnotes", "हाथ से लिखे नोट्स से रिविज़न करो। फिर पिछले साल के सवालों से अपनी तैयारी जाँचो।"),
              ("dmock", "मॉक लगाओ, और देखो हर जवाब सही या गलत क्यों है।"),
              ("dcta", "पोस्टल एज डॉट इन खोलो, फ्री डेमो देखो और अपना पहला मॉक लगाओ।"),
          ], keys[1:]+keys[:1])
          PY
      - name: Encrypt the preview before handing it off
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(rule3-preview/*)
          if (( ${#files[@]} == 0 )); then exit 0; fi
          cert=$(mktemp)
          cat > "$cert" <<'RULE3_CERT'
