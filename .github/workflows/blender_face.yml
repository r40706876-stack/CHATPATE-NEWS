# Blender से एक photo के भाव (हँसी/हैरान/गुस्सा/उदास/तंज़) → assets/real/<किरदार>_<भाव>.png. रोज़ के run में नहीं चलता.
name: blender-face
on:
  workflow_dispatch:
  push:
    branches: [main, claude/visual-upgrade]
    paths: [blender_face.py, face_rig.py, .github/workflows/blender_face.yml]
permissions: {contents: write}
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Blender 4.2 (portable)
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fsL --retry 3 -o "$RUNNER_TEMP/b.tar.xz" https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          tar -xJf "$RUNNER_TEMP/b.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          sudo apt-get install -y -qq libxi6 libxkbcommon0 libsm6 libxrender1 libxxf86vm1 libxfixes3 libgl1 libegl1 >/dev/null || true
      - name: render ramesh
        run: |
          mkdir -p logs
          "$RUNNER_TEMP/blender/blender" -b -P blender_face.py -- assets/real/ramesh.png assets/real/ramesh > logs/blender_face.log 2>&1 || true
          grep -E "rendered|Error|Traceback|line [0-9]" logs/blender_face.log | tail -20
          ls -la assets/real/ramesh_*.png
      - name: save
        run: |
          git config user.name Claude && git config user.email noreply@anthropic.com
          git add -f assets/real/ramesh_*.png logs/blender_face.log
          git diff --cached --quiet && exit 0
          git commit -m "Blender: Ramesh expressions [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
