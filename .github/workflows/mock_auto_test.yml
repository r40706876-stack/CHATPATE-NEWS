name: POSTAL WALA mock reel auto test (Bakra key 3)
on:
  push:
    branches: [mock-auto-test]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: mine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core libraqm0 poppler-utils
          pip install requests pypdf pillow numpy edge-tts playwright==1.47.0 faster-whisper
          python -m playwright install --with-deps chromium
      - name: Mock reel banao (apne aap sawal chuno)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
          GEMINI_TTS_VOICE: hi-in-training-1
          GEMINI_TTS_STYLE: "lively elder-brother teacher: warm, clear and expressive with natural ups and downs - curious on questions, firm and serious on warnings, happy on answers, calm on examples; small natural pauses"
        run: |
          python mock_reel.py build
          ls -la mock_reels
      - name: Save to branch mock-auto-out
        run: |
          mkdir -p /tmp/o && cp mock_reels/*.mp4 mock_reels/*_caption.txt mock_reels/*_script.json mock_reels/*_cover.jpg /tmp/o/ 2>/dev/null || true
          cd mine
          git config user.name "postal-demo-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan out
          git rm -rfq .
          cp /tmp/o/* . 2>/dev/null || echo "kuch nahi bana" > NOTHING.txt
          git add -A
          git commit -qm "mock auto test"
          git push -f origin out:mock-auto-out
