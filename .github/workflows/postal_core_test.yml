name: Postal core chaabi jaanch (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - name: CORE_TOKEN hai?
        env:
          T: ${{ secrets.CORE_TOKEN }}
        run: |
          [ -n "$T" ] && echo CORE_TOKEN_HAI || { echo CORE_TOKEN_NAHI; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: postal-pyq-out
          path: o
      - run: |
          ls o && cd o && git config user.name t && git config user.email t@t
          git checkout -q -b bk-chaabi-test && git commit -q --allow-empty -m t && git push -q origin bk-chaabi-test && echo CORE_WRITE_OK && git push -q origin --delete bk-chaabi-test
