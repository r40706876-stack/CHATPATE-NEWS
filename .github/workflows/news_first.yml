name: news-first-production
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'auto = fresh research; or externally reviewed episode path'
        default: 'auto'
concurrency:
  group: bakra-news-first-preview
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions: {contents: write, actions: write}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
      PREPARED_NEWS_SCRIPT: ${{ inputs.script || 'auto' }}
      GEMINI_REQUEST_BUDGET: '24'
      GEMINI_MODELS_PER_KEY: '3'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a fresh important-news episode
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          import news_first
          from run_daily import to_studio
          prepared = os.environ.get('PREPARED_NEWS_SCRIPT')
          if prepared == 'auto':
              prepared = ''
          if prepared:
              path = prepared
              ep = json.loads(Path(path).read_text(encoding='utf-8'))
          else:
              ep = to_studio(news_first.write(news_first.collect(), 1)[0])
          if not ep:
              raise RuntimeError('Character assets unavailable')
          news_first.require_national(ep)
          ep.update(style='flow', renderer='studio', lips='sadtalker', no_memes=True,
                    visual_policy='same-news source images or factual animated graphics')
          stamp = dt.datetime.now(dt.timezone.utc).strftime('%Y%m%d_%H%M%S')
          path = prepared or 'episodes/news_first_' + stamp + '.json'
          Path(path).write_text(json.dumps(ep, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('news_first_job.txt').write_text(path, encoding='utf-8')
          print('Prepared:', path, ep['topic'])
          PY
      - name: Save and render the prepared episode
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          job=$(cat news_first_job.txt)
          git config user.name bakra-production
          git config user.email bot@users.noreply.github.com
          git add "$job"
          if ! git diff --cached --quiet; then git commit -m "Prepare first important-news episode with matching visuals"; fi
          git pull --rebase
          git push
          gh workflow run talk_episode.yml --ref main -f script="$job"
