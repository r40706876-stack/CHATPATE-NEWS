name: Postal Edge easy Hindi reel
run-name: Postal Edge | Easy Hindi Postman reel
on:
  push:
    branches: ['preview/postal-recruitment-draft-20261120']
    paths: ['.github/workflows/postal_easy_hindi_reel.yml', 'oneoffs/postal_easy_hindi_reel/*']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          path: production
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: e60fdf3089b8aaac49562cb99030371051793fee
          path: core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video tools
        run: |
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install -q numpy scipy pillow requests playwright==1.47.0 edge-tts pymupdf pypdf
      - name: Prepare the approved hook and assets
        run: |
          mkdir -p core/reel-work/assets
          unzip -q core/previews/postal-edge-full-reel-assets.zip -d core/reel-work/assets
      - name: Record the easy Hindi dialogue
        working-directory: core
        env:
          POSTAL_KEY_1: ${{ secrets.GEMINI_API_KEY }}
          POSTAL_KEY_2: ${{ secrets.GEMINI_API_KEY2 }}
          POSTAL_KEY_3: ${{ secrets.GEMINI_API_KEY3 }}
          POSTAL_KEY_4: ${{ secrets.GEMINI_API_KEY4 }}
        run: python -u ../production/oneoffs/postal_easy_hindi_reel/record.py
      - name: Render and verify the updated fifty-second video
        working-directory: core
        run: python -u ../production/oneoffs/postal_easy_hindi_reel/render.py
      - uses: actions/upload-artifact@v4
        with:
          name: Postal_Edge_Postman_Easy_Hindi_50s
          path: |
            core/reel-work/Postal_Edge_Postman_Easy_Hindi_50s.mp4
            core/reel-work/checks.jpg
            core/reel-work/timing.json
            core/reel-work/verification.json
          if-no-files-found: error
          retention-days: 14
