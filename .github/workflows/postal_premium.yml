name: Postal PREMIUM deep class (Bakra ki keys)

# 2026-11-18: Postak by Postal Wala - Clause 1-5 demo videos. Script Claude ki (core: deep/premium/cN.json),
# premium animation, poori awaaz EK baar (kaati nahi jaati) - Bakra News ki Gemini keys (2,3,4,1) se.
# Bakra ka code/main nahi chhuta. Naya clause: neeche CLAUSE badlo aur commit karo (ya Run workflow). [run: demo 1 v3 FX - mohar, intro, chapters, awaaz reuse]
# Video + awaaz -> postal-wala-core branch "premium-<CLAUSE>" (har bhag alag branch, runs saath chal sakte) (awaaz save -> dobara bane to Gemini call nahi).
on:
  workflow_dispatch:
    inputs:
      clause:
        description: "Clause number"
        default: "1"
  push:
    branches: [main]
    paths: ['.github/workflows/postal_premium.yml']

env:
  CLAUSE: "2_1"
  LAND: "1"          # 1 = YouTube 16:9 (1920x1080), branch premium-<N>-yt
  BR_SUFFIX: "-v2"    # alag branch, purani demo file na mite
  TRUST_TAKE: "0"    # 1 = purani awaaz bina sha ke bhi (script na badli ho tab hi)
  FX: "1"            # mohar, wipe + title card, brand intro, YouTube chapters
  INTRO: "3"         # brand intro (sec) - awaaz utni der baad shuru

permissions:
  contents: read

concurrency:
  group: postal-premium-${{ github.sha }}
  cancel-in-progress: false

jobs:
  premium:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: main
      - name: Clause + purani awaaz
        run: |
          N="${{ inputs.clause }}"; N="${N:-$CLAUSE}"
          echo "N=$N" >> $GITHUB_ENV
          mkdir -p demo_out/deep /tmp/keep
          BR="premium-$N"; [ "$LAND" = "1" ] && BR="premium-$N-yt"; BR="$BR$BR_SUFFIX"; echo "BR=$BR" >> $GITHUB_ENV
          SH=$(sha256sum deep/premium/c$N.json | cut -c1-16)
          for B in "$BR" "premium-$N" "premium-out"; do
            rm -rf /tmp/try && mkdir -p /tmp/try
            git fetch -q --depth=1 origin "$B" 2>/dev/null || continue
            git archive FETCH_HEAD | tar -x -C /tmp/try
            OLD=$(cat /tmp/try/script_c$N.sha 2>/dev/null || true); echo "$B: script sha $SH, saved: $OLD"
            if [ -f /tmp/try/take_premium_c$N.wav ] && { [ "$OLD" = "$SH" ] || { [ -z "$OLD" ] && [ "$TRUST_TAKE" = "1" ]; }; }; then
              cp /tmp/try/take_premium_c$N.wav demo_out/deep/; cp /tmp/try/take_premium_c$N.wav /tmp/keep/
              echo "DEEP_TAKE=demo_out/deep/take_premium_c$N.wav" >> $GITHUB_ENV; echo "purani awaaz mili ($B) - Gemini call nahi"
              if [ -f /tmp/try/take_premium_c${N}_g.wav ]; then cp /tmp/try/take_premium_c${N}_g.wav demo_out/deep/; cp /tmp/try/take_premium_c${N}_g.wav /tmp/keep/; echo "DEEP_TAKE_G=demo_out/deep/take_premium_c${N}_g.wav" >> $GITHUB_ENV; echo "Golu ki purani awaaz bhi mili"; fi
              break
            fi
          done
          ls -la /tmp/keep || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core libraqm0 poppler-utils
          pip install requests pypdf pillow numpy scipy edge-tts playwright==1.47.0 faster-whisper
          python -m playwright install --with-deps chromium
      - name: Build (Claude script -> premium HTML)
        run: python deep/premium/build.py $N
      - name: Banao (awaaz + animation + sound)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_TTS_KEYS: ${{ secrets.GEMINI_API_KEY3 }},${{ secrets.GEMINI_API_KEY4 }},${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
          GEMINI_TTS_VOICE: hi-in-training-1
          GEMINI_TTS_STYLE: "patient elder-brother teacher explaining to a complete beginner: a little slower than normal speed, very clear words, warm and expressive - curious on questions, firm on warnings, happy on answers, calm on examples; a short natural pause after every important line"
          WHISPER_MODEL: medium
        run: |
          export DEEP_TAKE_SAVE=demo_out/deep/take_premium_c$N.wav
          export DEEP_TAKE_SAVE_G=demo_out/deep/take_premium_c${N}_g.wav
          python deep/premium/voice_premium.py deep/premium_c$N.html demo_out/deep/clause${N}_premium.mp4
      - name: Save (core branch premium-<N>) - awaaz pehle, video 95MB se chhoti karke
        if: always()
        run: |
          [ -f demo_out/deep/take_premium_c$N.wav ] && sha256sum deep/premium/c$N.json | cut -c1-16 > /tmp/keep/script_c$N.sha
          for f in demo_out/deep/take_premium_c$N.wav demo_out/deep/take_premium_c${N}_g.wav demo_out/deep/clause${N}_premium.mp4.cues.json demo_out/deep/clause${N}_premium_chapters.txt; do [ -f "$f" ] && cp "$f" /tmp/keep/; done
          V=demo_out/deep/clause${N}_premium.mp4
          if [ -f "$V" ]; then
            SZ=$(stat -c %s "$V")
            if [ "$SZ" -gt 95000000 ]; then
              echo "video $SZ bytes > 95MB -> chhoti kar rahe"
              ffmpeg -y -loglevel error -i "$V" -c:v libx264 -preset veryfast -crf 24 -profile:v high -pix_fmt yuv420p -c:a copy -movflags +faststart /tmp/small.mp4
              CRF=24; while [ $(stat -c %s /tmp/small.mp4) -gt 95000000 ] && [ $CRF -lt 32 ]; do CRF=$((CRF+2)); ffmpeg -y -loglevel error -i "$V" -c:v libx264 -preset veryfast -crf $CRF -pix_fmt yuv420p -c:a copy -movflags +faststart /tmp/small.mp4; done
              cp /tmp/small.mp4 /tmp/keep/clause${N}_premium.mp4
            else cp "$V" /tmp/keep/; fi
          fi
          ls -la /tmp/keep
          cd /tmp/keep && git init -q && git checkout -q -b premium-out
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          U="https://x-access-token:${{ secrets.CORE_TOKEN }}@github.com/r40706876-stack/postal-wala-core.git"
          git add -- *.wav *.json *.sha *.txt 2>/dev/null || true
          git commit -qm "premium clause $N awaaz (run ${{ github.run_id }})" && git push -f "$U" premium-out:$BR || true
          git add -A && git commit -qm "premium clause $N video (run ${{ github.run_id }})" || true
          git rev-parse -q --verify HEAD >/dev/null && git push -f "$U" premium-out:$BR || echo "save karne ko kuch nahi"
