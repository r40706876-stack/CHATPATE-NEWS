name: Postal Wala transfer dates animation preview
on:
  push:
    branches: [codex/postal-rule3-dates-20261116]
    paths: [postal_dates_preview/**, .github/workflows/postal_dates_preview.yml]
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: production
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          path: core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Prepare animation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core libraqm0
          pip install -q requests pypdf pillow numpy edge-tts playwright==1.47.0 faster-whisper
          python -m playwright install --with-deps chromium
          mkdir -p core/postal_dates_preview/assets
          cp production/postal_dates_preview/*.py production/postal_dates_preview/*.html core/postal_dates_preview/
          curl -fLsS --retry 2 https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js -o core/postal_dates_preview/assets/gsap.min.js
      - name: Wait for reusable narration artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            S=$(gh api repos/r40706876-stack/CHATPATE-NEWS/actions/runs/43813999408 --jq .status)
            [ "$S" = completed ] && exit 0
            sleep 10
          done
          echo 'Prior preview still running'; exit 1
      - uses: actions/download-artifact@v4
        with:
          name: Postal-Wala-GDS-Dates-Animation
          run-id: 43813999408
          github-token: ${{ github.token }}
          path: core/demo_out/rule3_dates
      - name: Gemini narration and animated dates video
        working-directory: core
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_TTS_VOICE: Charon
          GEMINI_TTS_GENDER: male
          GEMINI_TTS_STYLE: 'Professional warm Hindi male postal explainer, clear dates and year pronunciation, confident conversational delivery with natural emphasis. Read only the supplied narration.'
          VOICE_SPEEDUP: '1.0'
          BHAROSA_SPEED: '1.0'
          WHISPER_MODEL: small
          DEEP_TAKE_SAVE: demo_out/rule3_dates/narration.wav
          FPS: '30'
        run: python -u postal_dates_preview/produce.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Postal-Wala-GDS-Dates-Animation
          path: core/demo_out/rule3_dates/
          retention-days: 14
          if-no-files-found: warn
