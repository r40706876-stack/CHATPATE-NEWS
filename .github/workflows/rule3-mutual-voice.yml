name: Postal Edge Rule-3 warning voice pickup
run-name: Postal Edge | Rule-3 mutual transfer voice pickup
on:
  push:
    branches: [preview/rule3-transfer-2026]
    paths: ['.github/workflows/rule3-mutual-voice.yml']
permissions:
  contents: read
concurrency:
  group: rule3-transfer-voice-pickup
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: 212e56242b9fe5797a789d0d56b41bbb2ded0838
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /*.json
            /*.ttf
            /deep/
            /rebrand_reels/rule3_transfer_2026/
            /docs/transfer/
            /docs/icon-192.png
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare the established narration engine
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq -o Acquire::Retries=2 && sudo apt-get install -y -qq ffmpeg; }
          pip install -q playwright numpy pillow scipy requests edge-tts pypdf
      - name: Record the document walkthrough in Bhaiya’s approved voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}
        run: |
          python -u - <<'PY'
          import os, sys
          sys.path.insert(0, "rebrand_reels/rule3_transfer_2026")
          from render_preview import record_voice
          keys = list(dict.fromkeys(os.environ[name] for name in (
              "GEMINI_API_KEY4", "GEMINI_API_KEY3", "GEMINI_API_KEY2", "GEMINI_API_KEY",
          ) if os.environ.get(name)))
          if not keys:
              raise SystemExit("Approved voice engine is unavailable")
          record_voice("d", [
              ("dpoint", "पत्र पर इक्कीस नवंबर लिखा है, और इसमें पच्चीस नवंबर की एस ओ पी का ज़िक्र है। बाद की तारीख देखकर शक होता है।"),
              ("dpage", "ऊपर दिसंबर से जनवरी लिखा है, लेकिन दिख रही तालिका इकतीस दिसंबर पर खत्म है। इस फोटो में अधिकारी के हस्ताक्षर भी नहीं दिखते। हो सकता है अगला पन्ना हो।"),
              ("dverify", "जिन पुराने आदेशों का हवाला है, उनकी प्रतियाँ भी साथ नहीं हैं। पत्र फेक हो सकता है। इसे सही तभी मानें जब डाक विभाग का आधिकारिक नोटिफिकेशन इसकी पुष्टि करे।"),
          ], keys)
          PY
      - name: Encrypt the preview before handing it off
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(rule3-preview/*)
          if (( ${#files[@]} == 0 )); then exit 0; fi
