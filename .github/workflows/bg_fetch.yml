name: bg-fetch
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    env: {PIXABAY_API_KEY: "${{ secrets.PIXABAY_API_KEY }}"}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow && python bg_fetch.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f preview_bg.jpg assets/bg_options
          git commit -m "bg options" && for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
