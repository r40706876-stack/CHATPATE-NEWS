name: Postal Edge Rule-3 isolated render
run-name: Postal Edge | GDS Rule-3 private preview
on:
  push:
    branches: [preview/rule3-transfer-2026]
    paths: ['.github/workflows/rule3-preview-render.yml']
permissions:
  contents: read
concurrency:
  group: rule3-transfer-one-time-preview
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: 212e56242b9fe5797a789d0d56b41bbb2ded0838
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /*.json
            /*.ttf
            /deep/
            /rebrand_reels/rule3_transfer_2026/
            /docs/transfer/
            /docs/icon-192.png
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up renderer
        run: |
          sudo apt-get update -qq -o Acquire::Retries=2
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          pip install -q playwright==1.47.0 numpy pillow scipy requests edge-tts pypdf
          python -m playwright install --with-deps chromium
      - name: Render with the approved Golu and Bhaiya voices
        env:
          RULE3_RETAKE: 'd2 d3'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}



        run: python -u rebrand_reels/rule3_transfer_2026/render_preview.py
      - name: Verify both revised date sequences
        run: |
          python -m pip install -q faster-whisper
          python -u - <<'PY'
          from pathlib import Path
          import numpy as np
          from faster_whisper import WhisperModel
          folder = Path("rule3-preview")
          model = WhisperModel("small", device="cpu", compute_type="int8", cpu_threads=4)
          with (folder / "speech-check.txt").open("w", encoding="utf-8") as review:
              for scene in ("d2", "d3"):
                  audio = np.fromfile(folder / f"{scene}.f32", dtype="<f4")[::3].copy()
                  segments, _ = model.transcribe(audio, language="hi", beam_size=5,
                                                 repetition_penalty=1.15, no_repeat_ngram_size=3,
                                                 initial_prompt="कृपया शब्द और तारीखें देवनागरी हिंदी में लिखिए।")
                  review.write(scene + " " + " ".join(segment.text.strip() for segment in segments) + "\n")
          PY
      - name: Encrypt the preview before handing it off
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(rule3-preview/*)
          if (( ${#files[@]} == 0 )); then exit 0; fi
          cert=$(mktemp)
          cat > "$cert" <<'RULE3_CERT'
