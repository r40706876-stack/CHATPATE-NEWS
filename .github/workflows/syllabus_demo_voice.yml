name: Postal syllabus demo voice (locked Golu/Bhaiya, Bakra keys)
on:
  workflow_dispatch:
  push:
    branches: [preview/syllabus-demo]
    paths: ['oneoffs/syllabus_demo/**', '.github/workflows/syllabus_demo_voice.yml']
permissions:
  contents: write
concurrency:
  group: syllabus-demo-voice
  cancel-in-progress: true
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          path: core
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg libraqm0
          pip install -q requests pillow numpy scipy pypdf faster-whisper
      - name: TTS
        env:
          K1: ${{ secrets.GEMINI_API_KEY4 }}
          K2: ${{ secrets.GEMINI_API_KEY3 }}
          K3: ${{ secrets.GEMINI_API_KEY2 }}
          K4: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
          CORE_DIR: core
          OUT_DIR: /tmp/o
        run: |
          python oneoffs/syllabus_demo/imgs.py
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd /tmp/o && git init -q && git checkout -q -b syllabus-demo-imgs && git add . && git -c user.name=bot -c user.email=bot@x commit -qm "voice ${GITHUB_RUN_ID}" && git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" syllabus-demo-imgs
