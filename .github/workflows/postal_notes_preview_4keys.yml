name: Postal notes preview (4 Gemini keys)

# Roz: timer.yml 11:58 IST pe chalata hai (demo khaali, post=true) -> reel bane -> 1 PM IST pe Instagram post.
# Haath se demo: demo me 'part:naam:lang' likho.
on:
  push:
    paths: ['.github/workflows/postal_notes_preview_4keys.yml']
  workflow_dispatch:
    inputs:
      demo:
        description: "Demo topic(s), jaise 03:VPP:hi,03:VPP:en (khaali = aaj ki daily reel)"
        default: ""
      post:
        description: "Instagram pe post kare? (sirf daily reel)"
        type: boolean
        default: false
      only_post:
        description: "Nayi reel mat banao - aaj ki bani hui reel hi post karo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: notes-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-freefont-ttf >/dev/null
          pip install playwright==1.47.0 numpy requests pypdf pillow edge-tts >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Correct brand and remove rule counter on existing short video
        run: |
          python - <<'PY'
          import subprocess as s, numpy as np
          from PIL import Image, ImageDraw, ImageFont
          src='notes_reels/notes_2026-11-18_franking_hi_short.mp4'
          out='notes_reels/notes_2026-11-18_franking_hi_branded.mp4'
          import json
          p=json.loads(s.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_streams','-of','json',src]))['streams'][0]
          w,h=p['width'],p['height']
          dec=s.Popen(['ffmpeg','-v','error','-i',src,'-f','rawvideo','-pix_fmt','rgb24','-'],stdout=s.PIPE)
          enc=s.Popen(['ffmpeg','-v','error','-y','-f','rawvideo','-pix_fmt','rgb24','-s',f'{w}x{h}','-r',p['r_frame_rate'],'-i','-','-i',src,'-map','0:v','-map','1:a','-c:a','copy','-c:v','libx264','-crf','18','-preset','fast','-pix_fmt','yuv420p','-movflags','+faststart',out],stdin=s.PIPE)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',round(w*0.026))
          def box(x,y,X,Y): return tuple(round(v*k) for v,k in zip((x,y,X,Y),(w/928,h/1649,w/928,h/1649)))
          count=0
          while True:
              raw=dec.stdout.read(w*h*3)
              if len(raw)!=w*h*3: break
              im=Image.frombytes('RGB',(w,h),raw)
              ar=np.asarray(im)
              def navy(region):
                  x,y,X,Y=region; a=ar[y:Y,x:X].astype(int)
                  return ((a[:,:,2]>a[:,:,0]+25)&(a[:,:,0]<55)&(a[:,:,1]<75)).mean()
              head=box(145,38,460,89)
              if navy(head)>.45:
                  d=ImageDraw.Draw(im);d.rounded_rectangle(head,radius=round(w*.008),fill=(19,36,92))
                  d.text(((head[0]+head[2])/2,(head[1]+head[3])/2),'PosTak by Postal Wala',font=font,fill='white',anchor='mm')
                  # Remove only navy counter pill on ruled-paper teaching screens.
                  for yy in range(320,820,5):
                      r=box(413,yy,515,yy+57)
                      if navy(r)>.65:
                          x,y,X,Y=r; dx=round(w*120/928)
                          im.paste(im.crop((x-dx,y,X-dx,Y)),(x,y))
              enc.stdin.write(im.tobytes());count+=1
          enc.stdin.close();assert enc.wait()==0;assert dec.wait()==0
          print('Edited frames',count)
          PY
          ffprobe -v error -show_entries format=duration -of default=nw=1 notes_reels/notes_2026-11-18_franking_hi_branded.mp4
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes_reels
          git diff --cached --quiet || git commit -m "Notes reel [skip ci]"
          git pull --rebase -q origin main && git push
