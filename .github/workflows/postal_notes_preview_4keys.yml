name: Postal notes preview (4 Gemini keys)

# Roz: timer.yml 11:58 IST pe chalata hai (demo khaali, post=true) -> reel bane -> 1 PM IST pe Instagram post.
# Haath se demo: demo me 'part:naam:lang' likho.
on:
  push:
    paths: ['.github/workflows/postal_notes_preview_4keys.yml']
  workflow_dispatch:
    inputs:
      demo:
        description: "Demo topic(s), jaise 03:VPP:hi,03:VPP:en (khaali = aaj ki daily reel)"
        default: ""
      post:
        description: "Instagram pe post kare? (sirf daily reel)"
        type: boolean
        default: false
      only_post:
        description: "Nayi reel mat banao - aaj ki bani hui reel hi post karo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: notes-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-freefont-ttf >/dev/null
          pip install playwright==1.47.0 numpy requests pypdf pillow edge-tts >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Restore complete rule and remove spoken CTA
        run: |
          git show 9a8c42c:notes_reels/notes_2026-11-18_franking_hi.mp4 > /tmp/original.mp4
          git show c50715c:notes_reels/notes_2026-11-18_franking_hi_animated.mp4 > /tmp/animated.mp4
          python - <<'PY'
          import subprocess as s, numpy as np
          def frames(p):
              return np.frombuffer(s.check_output(['ffmpeg','-v','error','-i',p,'-vf','fps=30,scale=96:170,format=gray','-f','rawvideo','-']),np.uint8).reshape(-1,170,96).astype(float)
          o=frames('/tmp/original.mp4')
          # Match known rule and trap frames from the reviewed uploaded edit against original.
          e=frames('/tmp/animated.mp4')
          def match(t):
              return int(np.argmin(np.abs(o-e[round(t*30)]).mean(axis=(1,2))))
          trap=match(16.9); rule=match(18.5); gift=match(21.3)
          print('matched original frames',trap,rule,gift)
          # Find first transition to each card by matching its central text region.
          def boundary(ref,lo,hi):
              r=o[ref,65:105,10:86]
              d=np.abs(o[lo:hi,65:105,10:86]-r).mean(axis=(1,2))
              ix=np.where(d<12)[0]
              assert len(ix), 'card not located'
              return (lo+int(ix[0]))/30
          t=boundary(trap,450,trap+1)
          r=boundary(rule,max(trap+1,rule-240),rule+1)
          g=boundary(gift,max(rule+1,gift-180),gift+1)
          print('visual boundaries',t,r,g)
          # Audio onset may precede full card; use original scene transition near matched onset.
          assert 15<t<18 and 22<r<26 and 26<g<31 and r<g
          open('/tmp/times','w').write(f'{t-.2} {r-.2} {g-.2}\n')
          PY
          read TRAP RULE GIFT < /tmp/times
          ffmpeg -v error -y -ss 36 -i /tmp/animated.mp4 -frames:v 1 /tmp/cta.png
          ffmpeg -v error -y -i /tmp/original.mp4 -i /tmp/animated.mp4 -loop 1 -framerate 30 -i /tmp/cta.png -f lavfi -i anullsrc=r=48000:cl=stereo -filter_complex "[0:v]trim=end=${TRAP},setpts=PTS-STARTPTS[v0];[0:a]atrim=end=${TRAP},asetpts=PTS-STARTPTS[a0];[0:v]trim=start=${RULE}:end=${GIFT},setpts=PTS-STARTPTS[v1];[0:a]atrim=start=${RULE}:end=${GIFT},asetpts=PTS-STARTPTS[a1];[1:v]trim=start=22.433333:end=33.8,setpts=PTS-STARTPTS[v2];[1:a]atrim=start=22.433333:end=33.8,asetpts=PTS-STARTPTS[a2];[2:v]trim=duration=1,setpts=PTS-STARTPTS[v3];[3:a]atrim=duration=1,asetpts=PTS-STARTPTS[a3];[v0][a0][v1][a1][v2][a2][v3][a3]concat=n=4:v=1:a=1[v][a]" -map "[v]" -map "[a]" -c:v libx264 -crf 18 -preset fast -c:a aac -movflags +faststart notes_reels/notes_2026-11-18_franking_hi_short.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 notes_reels/notes_2026-11-18_franking_hi_short.mp4
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes_reels
          git diff --cached --quiet || git commit -m "Notes reel [skip ci]"
          git pull --rebase -q origin main && git push
