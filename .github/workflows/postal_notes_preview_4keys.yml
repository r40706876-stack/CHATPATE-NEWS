name: Postal notes preview (4 Gemini keys)

# Roz: timer.yml 11:58 IST pe chalata hai (demo khaali, post=true) -> reel bane -> 1 PM IST pe Instagram post.
# Haath se demo: demo me 'part:naam:lang' likho.
on:
  push:
    paths: ['.github/workflows/postal_notes_preview_4keys.yml']
  workflow_dispatch:
    inputs:
      demo:
        description: "Demo topic(s), jaise 03:VPP:hi,03:VPP:en (khaali = aaj ki daily reel)"
        default: ""
      post:
        description: "Instagram pe post kare? (sirf daily reel)"
        type: boolean
        default: false
      only_post:
        description: "Nayi reel mat banao - aaj ki bani hui reel hi post karo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: notes-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-freefont-ttf >/dev/null
          pip install playwright==1.47.0 numpy requests pypdf pillow edge-tts >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Reel banao
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_TTS_KEYS: ${{ secrets.GEMINI_API_KEY3 }},${{ secrets.GEMINI_API_KEY2 }},${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTES_GEMINI_ONLY: '1'
          NOTES_LAYOUT_QA: '1'
          NOTES_MAX_SEC: '55'
        if: ${{ !inputs.only_post }}
        run: |
          git show 8176c5be2d5b5b2ca5da209b2aa458360b59958d:notes_reel.py > notes_reel.py
          git show 8176c5be2d5b5b2ca5da209b2aa458360b59958d:reels/src/notes_scene.html > reels/src/notes_scene.html
          python - <<'PY'
          from pathlib import Path
          p=Path('notes_reel.py')
          s=p.read_text()
          s=s.replace('    sc = write_script(sel, lang, q, thin=thin)', '''    sc = {"hook":"फ्रैंकिंग मशीन की छाप लाल होती है या नीली? परीक्षा में यहीं गलती होती है।","lines":["फ्रैंकिंग मशीन डाक शुल्क की छाप लगाती है।","लाइसेंस डिवीजन प्रमुख देते हैं। सरकारी विभाग के लिए पी एम जी।","लाइसेंस पाँच साल का, फीस तीन सौ पचहत्तर रुपये।"],"trap":"पुरानी मशीन की छाप लाल, लेकिन आर एम एफ एम की छाप नीली होती है, साथ में टू डी बारकोड।","trick":"फ्रैंक लेख लेटर बॉक्स में डालने पर अदत्त माना जाता है।","cta":"फ्री पीडीएफ चाहिए तो कमेंट में पीडीएफ लिखें। अगली वीडियो के लिए फॉलो करें।","thumb_q":"फ्रैंकिंग मशीन की छाप किस रंग की?"}
              sel["pyq"]=["MP 2022","केरल 2021"]
              shots["lines"]=shots["lines"][:3]
              assert len(shots["lines"])==3''')
          s=s.replace('for k2 in ("tiles", "trap", "trick", "quiz"):', 'for k2 in ("trap", "trick"):')
          s=s.replace('    order.append(("cta", sc["cta"]))','    order.append(("surprise", "आपके लिए सरप्राइज गिफ्ट!"))\n    order.append(("cta", sc["cta"]))')
          s=s.replace('    while est() > MAX_SEC and len(li) > 2:', '    while False:')
          s=s.replace('"lines": [rel(p) for p in shots["lines"]],','"point_text": sc["lines"], "lines": [rel(p) for p in shots["lines"]],')
          s=s.replace('    silent = os.path.join(tmp, "silent.mp4")','    name = "notes_2026-11-18_franking_hi"\n    silent = os.path.join(tmp, "silent.mp4")')
          s=s.replace('PDF लिंक बायो में ↑','कमेंट में PDF लिखें').replace('लिंक बायो में','कमेंट में PDF लिखें')
          p.write_text(s)
          h=Path('reels/src/notes_scene.html')
          t=h.read_text()
          start=t.index('// lines')
          end=t.index('// tiles',start)
          t=t[:start]+'''// lines
          D.lines.forEach((p,n)=>{const r=scene('line'+n,`<div class="cnt">1 / 2</div><div class="tableNotes"><h2>फ्रैंकिंग मशीन</h2>${["डाक शुल्क की छाप लगाने वाली मशीन","लाइसेंस: SP / SSP · सरकारी विभाग: PMG","वैधता: 5 साल · फीस: ₹375"].map((v,i)=>`<div class="noteRow ${i===n?'active':''}">${v}</div>`).join('')}<small>PYQ · MP 2022 · केरल 2021</small></div>`,'in');});
          '''+t[end:]
          t=t.replace('</style>', '.tableNotes{width:100%;background:#fff9e9;border:2px solid #13245c;border-radius:12px;padding:16px;font-family:"Kalam","Hind",sans-serif;font-size:26px;line-height:1.4}.tableNotes h2{color:#c62828;font-size:30px}.noteRow{padding:14px 4px;border-bottom:1px solid #b9c9df;color:#13245c}.noteRow.active{background:#ffe67a}.tableNotes small{color:#6b2bd9;font-size:17px}.gift{background:#fff5c9;border:3px solid #e5aa25;border-radius:24px;padding:24px;text-align:center;font-size:26px}</style>')
          t=t.replace('// cta', '''scene('surprise','<div class="gift">🎁 आपके लिए सरप्राइज़!<h2>फ्री हैंडराइटिंग नोट्स PDF</h2>वीडियो लाइक करें और 3 GDS साथियों को शेयर करें</div>','pop');
          // cta''')
          start=t.index('// trap / trick')
          end=t.index('// quiz',start)
          t=t[:start]+'''// trap / trick
          scene('trap','<div class="tableNotes" style="border:3px solid #c62828"><h2>⚠ परीक्षा TRAP</h2><div class="noteRow">पुरानी मशीन: <b style="color:#c62828">लाल छाप</b></div><div class="noteRow active">RMFM: <b style="color:#174ba0">नीली छाप</b> + 2D बारकोड</div></div>','pop');
          scene('trick','<div class="tableNotes" style="background:#fff59a"><h2>★ जरूरी नियम</h2>फ्रैंक लेख लेटर बॉक्स में नहीं। डाला तो <b>Unpaid (अदत्त)</b>।</div>','pop');
          '''+t[end:]
          t=t.replace('POSTAL WALA</b>','PosTak · Postal Wala</b>')
          h.write_text(t)
          PY
          python notes_reel.py build --demo '01:ज़रूरी बातें:hi'
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes_reels
          git diff --cached --quiet || git commit -m "Notes reel [skip ci]"
          git restore -- reels/src/notes_scene.html notes_reel.py
          git pull --rebase -q origin main && git push
