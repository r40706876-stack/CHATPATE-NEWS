name: Postal notes preview (4 Gemini keys)

# Roz: timer.yml 11:58 IST pe chalata hai (demo khaali, post=true) -> reel bane -> 1 PM IST pe Instagram post.
# Haath se demo: demo me 'part:naam:lang' likho.
on:
  push:
    paths: ['.github/workflows/postal_notes_preview_4keys.yml']
  workflow_dispatch:
    inputs:
      demo:
        description: "Demo topic(s), jaise 03:VPP:hi,03:VPP:en (khaali = aaj ki daily reel)"
        default: ""
      post:
        description: "Instagram pe post kare? (sirf daily reel)"
        type: boolean
        default: false
      only_post:
        description: "Nayi reel mat banao - aaj ki bani hui reel hi post karo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: notes-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-freefont-ttf >/dev/null
          pip install playwright==1.47.0 numpy requests pypdf pillow edge-tts >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Reel banao
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_TTS_KEYS: ${{ secrets.GEMINI_API_KEY3 }},${{ secrets.GEMINI_API_KEY2 }},${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTES_GEMINI_ONLY: '1'
          NOTES_LAYOUT_QA: '1'
          NOTES_MAX_SEC: '40'
        if: ${{ !inputs.only_post }}
        run: |
          git show 8176c5be2d5b5b2ca5da209b2aa458360b59958d:notes_reel.py > notes_reel.py
          git show 8176c5be2d5b5b2ca5da209b2aa458360b59958d:reels/src/notes_scene.html > reels/src/notes_scene.html
          python - <<'PY'
          from pathlib import Path
          p=Path('notes_reel.py')
          s=p.read_text()
          marker='    subprocess.run([sys.executable, os.path.join(ROOT, "reels", "src", "render.py"), scene'
          assert marker in s
          s=s.replace(marker,'    from notes_editorial import check_layout\n    check_layout(scene, data)\n    assert total <= 40, f"Duration {total} exceeds 40 seconds"\n'+marker)
          s=s.replace('पूरी PDF लिंक बायो में, फॉलो करो!', 'फ्री पीडीएफ चाहिए? कमेंट में पीडीएफ लिखें।').replace('PDF लिंक बायो में ↑','कमेंट में PDF लिखें ↓').replace('लिंक बायो में','कमेंट में PDF लिखें')
          s=s.replace('    order.append(("cta", sc["cta"]))','    order.append(("surprise", "सरप्राइज!"))\n    order.append(("cta", sc["cta"]))')
          p.write_text(s)
          scene=Path('reels/src/notes_scene.html')
          h=scene.read_text()
          assert '// cta' in h
          h=h.replace('// cta', '''scene('surprise',`<div class="stamp" style="background:#ffcc33;color:#14265d;font-size:38px;padding:18px 28px">🎁 SURPRISE!</div>`,'pop');\n// cta''')
          scene.write_text(h)
          PY
          python notes_reel.py build --demo '01:पूर्व भुगतान क्यों ज़रूरी:hi'
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes_reels
          git diff --cached --quiet || git commit -m "Notes reel [skip ci]"
          git restore -- reels/src/notes_scene.html notes_reel.py
          git pull --rebase -q origin main && git push
