name: Postal Edge full reel final captions
on:
  push:
    branches: ['preview/postal-edge-transfer-hook-4s']
    paths: ['.github/workflows/postal_transfer_full_final.yml']
permissions:
  contents: read
  actions: read
jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45049769469
          name: Postal_Edge_GDS_Transfer_Postman_Draft
          path: original
      - name: Fix type in the page-five scene
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          echo '' | base64 --decode > proof-title.png
          echo '' | base64 --decode > proof-caption.png
          mkdir -p final
          ffmpeg -v error -y -i original/Postal_Edge_GDS_Transfer_Postman_Draft.mp4 \
            -i proof-title.png -i proof-caption.png \
            -filter_complex "[0:v][1:v]overlay=x=135:y='295+round(18*(1-pow(clip((t-11.433333)/.44,0,1),2)*(3-2*clip((t-11.433333)/.44,0,1))))':enable='gte(t,11.433333)*lt(t,19.033333)'[head];[head][2:v]overlay=x=105:y=957:enable='gte(t,11.433333)*lt(t,19.033333)'[v]" \
            -map "[v]" -map 0:a:0 -c:v libx264 -preset veryfast -crf 16 -fps_mode passthrough -c:a copy -movflags +faststart final/Postal_Edge_GDS_Transfer_Postman_Draft.mp4
          ffmpeg -v error -xerror -i final/Postal_Edge_GDS_Transfer_Postman_Draft.mp4 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: Postal_Edge_GDS_Transfer_Postman_Draft_Final
          path: final/Postal_Edge_GDS_Transfer_Postman_Draft.mp4
          if-no-files-found: error
          retention-days: 14
