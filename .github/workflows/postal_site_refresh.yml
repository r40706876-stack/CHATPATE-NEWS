name: Postal website taaza (raat ke nateeje -> core -> website)
# Har 2 ghante: postal-pyq-out / postal-hx / postal-fm ke nateeje core main me jodo, site banao, commit.
# (Website deploy: public repo ka pages_deploy har ghante core docs/ dekhta hai.)
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: postal-site-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -q pillow
      - name: Nateeje lo + jodo + site
        run: |
          mkdir -p /tmp/r
          for b in "postal-pyq-out:pyq_bank.json" "postal-hx:hx_done.json" "postal-fm:fm_done.json"; do
            br=${b%%:*}; f=${b##*:}
            git fetch -q --depth=1 origin $br 2>/dev/null && git show FETCH_HEAD:$f > /tmp/r/$f 2>/dev/null || rm -f /tmp/r/$f
          done
          python site/refresh_data.py /tmp/r
          python site/build_site.py . docs | tail -n 3
      - name: Core me commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyq_papers docs
          if git diff --staged --quiet; then echo "kuch naya nahi"; exit 0; fi
          git commit -qm "website taaza: raat ke vishleshan/sawal [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
