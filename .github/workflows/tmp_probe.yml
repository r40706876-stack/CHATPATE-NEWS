name: tmp probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          curl -sSL -m 120 -A "Mozilla/5.0" -o v6.pdf "https://utilities.cept.gov.in/dop/pdfbind.ashx?id=5576"; pdftotext v6.pdf v6.txt; wc -c v6.txt; grep -c "" v6.txt; sed -n 1,60p v6.txt | tr -s ' \n' | head -c 2500; echo; grep -iE "^ *[0-9]+\. " v6.txt | head -40
          curl -sSL -m 60 -A "Mozilla/5.0" "https://app.indiapost.gov.in/enterpriseportal/rti/rti-manual-five" | grep -oiE '(https?:)?[^"'"'"' ]+\.(pdf|ashx[^"'"'"' ]*)' | head -30
