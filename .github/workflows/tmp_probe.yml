name: tmp probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: main
          fetch-depth: 1
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          curl -sSL -m 120 -A "Mozilla/5.0" -o /tmp/v6.pdf "https://utilities.cept.gov.in/dop/pdfbind.ashx?id=5576"
          for i in 1 2 3 4; do curl -sSL -m 180 -A "Mozilla/5.0" -o /tmp/v7.pdf "https://web.archive.org/web/2024id_/https://www.indiapost.gov.in/VAS/DOP_RTI/PM_VOL_7.pdf"; file /tmp/v7.pdf | grep -q PDF && break; sleep 30; done
          file /tmp/v6.pdf /tmp/v7.pdf | grep -c PDF | grep -q 2
          mkdir -p pyq_papers/law; pdftotext /tmp/v6.pdf pyq_papers/law/pm_vol6_p3.txt; pdftotext /tmp/v7.pdf pyq_papers/law/pm_vol7.txt; wc -c pyq_papers/law/pm_*.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyq_papers/law/pm_vol6_p3.txt pyq_papers/law/pm_vol7.txt && git commit -qm "Postal Manual Vol VI Part III + Vol VII ka sarkari text (Postman Paper-II sawal ke liye) [skip ci]" && git pull -q --rebase && git push -q
