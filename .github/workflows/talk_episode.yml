# पूरी episode: हर line अलग job में एक साथ (parallel) SadTalker → जोड़कर पुराना TV look → Telegram
name: talk-episode
on:
  workflow_dispatch:
    inputs:
      script: {description: "episode की JSON (repo में)", default: "episodes/bijli.json"}
      prep: {description: "full / extcrop", default: "full"}
      pose: {description: "सिर हिलने का अंदाज़ 0-45", default: "0"}
      still: {description: "सिर स्थिर (yes = सिर्फ़ होंठ/आँख/चेहरा, शांत anchor जैसा)", default: "yes"}
      expr: {description: "चेहरे/होंठ के हिलने की ताकत (3D किरदार पर 1.5 अच्छा)", default: "1.5"}
      size: {description: "SadTalker model: 512 = साफ़ चेहरा (धीमा), 256 = तेज़", default: "256"}
  push:
    branches: ['feature/retention-comedy-quality-gate-20261025']
    paths:
      - 'episodes/waiting_ticket_comedy.json'
      - 'reel_studio.py'
      - 'talk_episode.py'
      - 'qa.py'
      - 'tts.py'
      - 'comedy_review.py'
      - 'visual_strategy.py'
      - 'hybrid_stage.py'
      - 'tests/storyboard_preflight.py'
      - 'tests/test_visual_strategy.py'
      - 'tests/test_hybrid_stage.py'
      - 'tests/test_tts_pacing.py'
      - '.github/workflows/talk_episode.yml'
# Only the newest branch render may consume expensive TTS/render time.
concurrency:
  group: talk-episode-${{ github.ref }}
  cancel-in-progress: true
env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
  GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  YT_COOKIES: ${{ secrets.YT_COOKIES }}
  IG_COOKIES: ${{ secrets.IG_COOKIES }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
jobs:
  prep:
    runs-on: ubuntu-latest
    outputs: {lines: "${{ steps.p.outputs.lines }}"}
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg — reuse runner binaries; download only if absent
        timeout-minutes: 6
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "Using runner FFmpeg and FFprobe; skipping slow Ubuntu mirror"
          else
            curl -fLsS --retry 2 --max-time 150 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
            mkdir -p /tmp/ffmpeg-bin
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-bin
            sudo cp /tmp/ffmpeg-bin/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-bin/ffmpeg-*-static/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - id: p
        run: |
          set -o pipefail
          /usr/bin/python3 -m pip install -q --break-system-packages numpy scipy pillow edge-tts rembg onnxruntime "yt-dlp[default]"
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1; export PATH=$HOME/.deno/bin:$PATH   # YouTube के JS challenge के लिए
          # Fast visual/scene validation BEFORE paying the TTS and MP4 render cost.
          python3 tests/storyboard_preflight.py
          python3 -m unittest discover -s tests -p test_comedy_gate.py -q
          python3 -m unittest discover -s tests -p test_visual_strategy.py -q
          python3 -m unittest discover -s tests -p test_hybrid_stage.py -q
          python3 -m unittest discover -s tests -p test_tts_pacing.py -q
          python3 - <<'PY'
          import tts
          assert tts.speakable("WL-48 से WL-47") == "डब्ल्यूएल 48 से डब्ल्यूएल 47"
          assert tts.speakable("EMI और wi-fi") == "ईएमआई और वाईफ़ाई"
          print("PASS: TTS acronyms, hyphens and railway waitlist codes")
          PY
          python3 - <<'PY'
          import json, bakra_rules
          ep=json.load(open("episodes/waiting_ticket_comedy.json",encoding="utf-8"))
          violations=bakra_rules.violations(ep)
          if violations:
              raise SystemExit("Script quality gate failed: "+str(violations))
          if len(ep["lines"]) < 5 or len(ep["lines"]) > 9:
              raise SystemExit("Expected 5-9 comedy dialogue beats")
          print("PASS: comedy script structural checks")
          PY
          # Independent Gemini critique is editorial, not a claim about real viewers.
          # If Gemini is quota-limited it records 'unavailable'; a low reviewed score blocks render.
          python3 comedy_review.py "episodes/waiting_ticket_comedy.json"
          /usr/bin/python3 talk_episode.py prep "${{ inputs.script || 'episodes/waiting_ticket_comedy.json' }}" | tee prep.log
          echo "lines=$(tail -1 prep.log)" >> $GITHUB_OUTPUT
      - name: Upload independent comedy editorial review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comedy-editorial-review
          path: comedy_review.json
          if-no-files-found: ignore
      - name: Upload fast storyboard preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-storyboard-preflight
          path: preflight_storyboard.jpg
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: st_in
          path: st_in
          if-no-files-found: error

  face:
    needs: prep
    if: needs.prep.outputs.lines != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: {line: "${{ fromJSON(needs.prep.outputs.lines) }}"}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: st_in, path: st_in}
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - uses: actions/cache@v4
        with: {path: st_models, key: "sadtalker-${{ inputs.size || '256' }}-v1"}
      - uses: actions/cache@v4
        with: {path: ~/.cache/pip, key: sadtalker-pip-v1}
      - name: SadTalker install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
          git clone -q --depth 1 https://github.com/OpenTalker/SadTalker st
          mkdir -p st_models/checkpoints st_models/gfpgan/weights
          cd st_models/checkpoints
          for f in mapping_00109-model.pth.tar mapping_00229-model.pth.tar SadTalker_V0.0.2_${{ inputs.size || '256' }}.safetensors; do
            test -s $f || wget -q https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc/$f; done
          cd ../gfpgan/weights
          test -s alignment_WFLW_4HG.pth || wget -q https://github.com/xinntao/facexlib/releases/download/v0.1.0/alignment_WFLW_4HG.pth
          test -s detection_Resnet50_Final.pth || wget -q https://github.com/xinntao/facexlib/releases/download/v0.1.0/detection_Resnet50_Final.pth
          test -s GFPGANv1.4.pth || wget -q https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth
          test -s parsing_parsenet.pth || wget -q https://github.com/xinntao/facexlib/releases/download/v0.2.2/parsing_parsenet.pth
          cd $GITHUB_WORKSPACE
          ln -s $GITHUB_WORKSPACE/st_models/checkpoints st/checkpoints
          ln -s $GITHUB_WORKSPACE/st_models/gfpgan st/gfpgan
          pip install -q torch==1.12.1+cpu torchvision==0.13.1+cpu torchaudio==0.12.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
          grep -v gradio st/requirements.txt > st/req.txt
          pip install -q -r st/req.txt
      - name: चेहरा हिलाओ (line ${{ matrix.line }})
        run: |
          cd st
          time python inference.py --driven_audio ../st_in/${{ matrix.line }}/talk.wav \
            --source_image ../st_in/${{ matrix.line }}/source.png --result_dir ../st_out/${{ matrix.line }} \
            --preprocess ${{ inputs.prep || 'full' }} --pose_style ${{ inputs.pose || '0' }} --expression_scale ${{ inputs.expr || '1.5' }} --size ${{ inputs.size || '256' }} --cpu --batch_size 4 \
            $( [ "${{ inputs.still || 'yes' }}" = "yes" ] && echo --still )
      - uses: actions/upload-artifact@v4
        with: {name: "clip-${{ matrix.line }}", path: st_out}

  join:
    needs: [prep, face]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg — reuse runner binaries; download only if absent
        timeout-minutes: 6
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "Using runner FFmpeg and FFprobe; skipping slow Ubuntu mirror"
          else
            curl -fLsS --retry 2 --max-time 150 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
            mkdir -p /tmp/ffmpeg-bin
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-bin
            sudo cp /tmp/ffmpeg-bin/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-bin/ffmpeg-*-static/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - uses: actions/download-artifact@v4
        with: {name: st_in, path: st_in}
      - name: Retrieve same-run Gemini editorial verdict for delivery gate
        uses: actions/download-artifact@v4
        with: {name: comedy-editorial-review, path: .}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {pattern: "clip-*", path: st_out, merge-multiple: true}
      - run: |
          if [ -d st_out ]; then find st_out -maxdepth 2 -type f | head -40; else echo '3D sprite mode: SadTalker clips correctly skipped'; fi
          /usr/bin/python3 -m pip install -q --break-system-packages numpy scipy pillow rembg onnxruntime
          /usr/bin/python3 talk_episode.py post
      - name: Independent final MP4 QA (respect editorial hold)
        if: success()
        run: |
          /usr/bin/python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          import qa
          p=Path('episode.mp4')
          issues=qa.check(p)+qa.check_media(p)
          if p.exists():
              probe=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','json',str(p)],
                                   capture_output=True,text=True,check=True)
              duration=float(json.loads(probe.stdout)['format']['duration'])
              if duration>28:
                  issues.append(f'Comedy demo too long: {duration:.1f}s (limit 28s)')
          if issues:
              raise SystemExit('Final independent QA failed: '+'; '.join(issues))
          ep=json.loads(Path('st_in/episode.json').read_text(encoding='utf-8'))
          if ep.get('no_send'):
              print('PASS: final MP4 QA; Telegram held by no_send editorial flag')
          else:
              print('PASS: final MP4 QA; talk_episode.py post handles single Telegram delivery')
          PY
      - name: Preserve rendered MP4 for independent visual and audio review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ job.status == 'success' && 'render-qa-passed' || 'qa-rejected-video' }}
          path: |
            episode.mp4
            preview_episode.jpg
          if-no-files-found: ignore
          retention-days: 14
      - name: झलक सेव
        if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f preview_episode.jpg last_quality.json 2>/dev/null || true
          # Never publish a rejected render as the latest successful episode.
          if [ "${{ job.status }}" = "success" ] && [ -f episode.mp4 ] && [ $(stat -c%s episode.mp4) -lt 45000000 ]; then cp episode.mp4 last_episode.mp4; git add -f last_episode.mp4; fi
          git diff --cached --quiet && exit 0
          git commit -m "episode preview"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
