# भाव वाली library (free, अपने-आप): LivePortrait के अपने भाव (हँसी, दुख, हैरानी…) हमारे किरदारों पर
# → assets/expr/<who>_<expr>.mp4 (reaction clip) + .jpg (भाव वाली फ़ोटो)
name: expr-library
on:
  workflow_dispatch:
    inputs:
      who: {description: "किरदार, comma से", default: "ramesh,bablu,chacha,dadi,pinky"}
      exprs: {description: "भाव", default: "hasi,udaas,hairan,gussa,tanz,sharm,cheekh"}
      mult: {description: "भाव की ताकत", default: "1.2"}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {who: "${{ steps.p.outputs.who }}"}
    steps:
      - id: p
        run: echo "who=$(python3 -c "import json;print(json.dumps('${{ inputs.who }}'.split(',')))")" >> $GITHUB_OUTPUT
  make:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: {contents: write}
    strategy:
      fail-fast: false
      matrix: {who: "${{ fromJSON(needs.plan.outputs.who) }}"}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0
      - name: किरदार की फ़ोटो (गाँव वाली पृष्ठभूमि)
        run: |
          /usr/bin/python3 -m pip install -q --break-system-packages numpy scipy pillow rembg onnxruntime
          mkdir -p drv && /usr/bin/python3 expr_lib.py source "${{ matrix.who }}" && ls -la drv
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - uses: actions/cache@v4
        with: {path: lp_weights, key: liveportrait-w1}
      - uses: actions/cache@v4
        with: {path: ~/.cache/pip, key: liveportrait-pip-v1}
      - name: LivePortrait install
        run: |
          git clone -q --depth 1 https://github.com/KwaiVGI/LivePortrait lp
          pip install -q torch==2.3.0 torchvision==0.18.0 --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -q -r lp/requirements_base.txt onnxruntime==1.18.0 "huggingface_hub[cli]<0.26"
          test -d lp_weights/liveportrait || huggingface-cli download KlingTeam/LivePortrait --local-dir lp_weights --exclude "*.git*" "README.md" "docs"
          ls -R lp_weights | head -40 > lp_weights_list.txt; mkdir -p assets/expr; cp lp_weights_list.txt assets/expr/weights_${{ matrix.who }}.txt
          rm -rf lp/pretrained_weights && ln -s $GITHUB_WORKSPACE/lp_weights lp/pretrained_weights
      - name: भाव लगाओ (CPU)
        run: |
          mkdir -p assets/expr out
          W=${{ matrix.who }}
          for e in $(echo "${{ inputs.exprs }}" | tr ',' ' '); do
            d=$(python3 -c "import expr_lib;print(expr_lib.BUILTIN['$e'])")
            rm -rf lp_out
            src=lp/assets/examples/driving/$d
            case "$d" in *.mp4) ffmpeg -loglevel error -y -i $src -t 3.2 -an drv/cut_$d && src=drv/cut_$d ;; esac
            (cd lp && time python inference.py -s ../drv/${W}_src.png -d ../$src -o ../lp_out \
               --flag_force_cpu --no_flag_use_half_precision --driving_multiplier ${{ inputs.mult }}) > lp.log 2>&1 || true
            tail -40 lp.log >> assets/expr/log_${W}.txt
            f=$(ls lp_out/* 2>/dev/null | grep -v concat | head -1)
            echo "$e -> $f"
            case "$f" in
              *.mp4) cp "$f" assets/expr/${W}_$e.mp4 && /usr/bin/python3 expr_lib.py still assets/expr/${W}_$e.mp4 ;;
              *.jpg|*.png) /usr/bin/python3 -c "from PIL import Image;Image.open('$f').convert('RGB').save('assets/expr/${W}_$e.jpg')" ;;
            esac
          done
          ls -la assets/expr
      - name: सेव
        if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f assets/expr 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "भाव library: ${{ matrix.who }}"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((RANDOM % 10 + 3)); done
  sheet:
    needs: make
    if: always()
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q pillow && python expr_lib.py sheet || true
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f preview_expr.jpg 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "भाव library झलक" && for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
