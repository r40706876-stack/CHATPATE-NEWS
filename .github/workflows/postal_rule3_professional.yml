name: Postal Wala Rule3 professional preview
on:
  push:
    branches: [codex/postal-rule3-professional-20261116]
    paths: [postal_rule3_preview/**, .github/workflows/postal_rule3_professional.yml]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: production
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: main
          path: core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Prepare renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core libraqm0
          pip install -q requests pypdf pillow numpy edge-tts playwright==1.47.0 faster-whisper
          python -m playwright install --with-deps chromium
          mkdir -p core/postal_rule3_preview/assets
          cp production/postal_rule3_preview/*.py production/postal_rule3_preview/*.html core/postal_rule3_preview/
          curl --fail --retry 2 -LsS https://postalwala.pages.dev/img/bhaiya.webp -o core/postal_rule3_preview/assets/bhaiya.webp
      - name: Gemini male narration and 1080p animation
        working-directory: core
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_TTS_VOICE: Charon
          GEMINI_TTS_GENDER: male
          GEMINI_TTS_STYLE: 'Warm professional Hindi male explainer. Clear, conversational, confident; natural pace and emphasis, no theatrical shouting. Read only the supplied Hindi text.'
          VOICE_SPEEDUP: '1.0'
          BHAROSA_SPEED: '1.0'
          WHISPER_MODEL: small
          DEEP_TAKE_SAVE: demo_out/rule3/narration.wav
          FPS: '30'
        run: |
          test -n "$GEMINI_API_KEY" || { echo 'Selected key4 is not configured'; exit 1; }
          python -u postal_rule3_preview/produce.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Postal-Wala-GDS-Rule3-professional
          path: |
            core/demo_out/rule3/Postal_Wala_GDS_Rule3.mp4
            core/demo_out/rule3/Postal_Wala_GDS_Rule3.mp4.cues.json
            core/demo_out/rule3/narration.wav
            core/demo_out/rule3/frame_*.jpg
            core/demo_out/rule3/technical_qa.json
            core/demo_out/rule3/sources.txt
          retention-days: 14
          if-no-files-found: warn
