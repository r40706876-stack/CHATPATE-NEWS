# Manual re-send of an already QA-approved last_episode.mp4.
# The talk-episode join job handles automatic Telegram delivery after QA.
# GitHub's GITHUB_TOKEN pushes do not trigger new push workflows.
name: send-last
on:
  workflow_dispatch:
    inputs:
      caption: {description: "caption", default: "🐐 बकरा न्यूज़ • QA-पास डेमो (पोस्ट करने से पहले देखें)"}
concurrency:
  group: send-last-${{ github.ref }}
  cancel-in-progress: false
env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install independent media QA dependencies
        run: |
          command -v ffmpeg && command -v ffprobe
          /usr/bin/python3 -m pip install -q --break-system-packages numpy
      - name: Independently verify MP4 and deliver demo
        run: |
          /usr/bin/python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          import qa, telegram
          p=Path('last_episode.mp4')
          issues=qa.check(p)+qa.check_media(p)
          if p.exists():
              probe=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','json',str(p)],
                                   capture_output=True,text=True,check=True)
              duration=float(json.loads(probe.stdout)['format']['duration'])
              if duration>28:
                  issues.append(f'Overlong comedy demo: {duration:.1f}s (limit 28s)')
          if issues:
              raise SystemExit('Telegram blocked by independent QA: '+'; '.join(issues))
          caption='🐐 बकरा न्यूज़ • QA-पास डेमो (पोस्ट करने से पहले देखें)'
          if not telegram.send_video(p,caption):
              raise SystemExit('Telegram credentials unavailable or delivery rejected')
          print('PASS: verified MP4 delivered to Telegram')
          PY
