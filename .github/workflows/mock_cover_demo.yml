name: POSTAL WALA mock cover demo
on:
  push:
    branches: [mock-cover-demo]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: mine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core libraqm0 poppler-utils
          pip install requests pillow playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Cover banao
        run: |
          python mock_reel.py cover p_9ad2b1d2e4 $(python -c "import json;print(' '.join(x['id'] for x in json.load(open('pyq_papers/pyq_bank.json'))['items'] if 'रात्रि' in x.get('q','') and 'नहीं' in x.get('q',''))[:1]))") || true
          ls -la mock_reels
      - name: Save to branch mock-auto-out
        run: |
          mkdir -p /tmp/o && cp mock_reels/cover_test_*.jpg /tmp/o/ 2>/dev/null || true
          cd mine
          git config user.name "postal-demo-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan out
          git rm -rfq .
          cp /tmp/o/* . 2>/dev/null || echo "kuch nahi bana" > NOTHING.txt
          git add -A
          git commit -qm "mock auto test"
          git push -f origin out:mock-cover-out
