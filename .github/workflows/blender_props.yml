# एक बार: Blender से पैसे वाले 3D clips (सिक्के, टॉफी, नोटों की गड्डी) → assets/fx/props/*.mp4. रोज़ के run में Blender नहीं चलता.
name: blender-props
on:
  workflow_dispatch:
  push:
    branches: [main, claude/visual-upgrade]
    paths: [blender_props.py, .github/workflows/blender_props.yml]
permissions: {contents: write}
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: {prop: [coins, toffee, notes]}
    steps:
      - uses: actions/checkout@v4
      - name: Blender 4.2 (portable)
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fsL --retry 3 -o "$RUNNER_TEMP/b.tar.xz" https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          tar -xJf "$RUNNER_TEMP/b.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          sudo apt-get install -y -qq libxi6 libxkbcommon0 libsm6 libxrender1 libxxf86vm1 libxfixes3 libgl1 libegl1 >/dev/null || true
      - name: render ${{ matrix.prop }}
        run: |
          mkdir -p assets/fx/props
          command -v ffmpeg || { sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true; }
          command -v ffmpeg || { python3 -m pip install -q imageio-ffmpeg && sudo ln -sf "$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg; }
          "$RUNNER_TEMP/blender/blender" -b -P blender_props.py -- ${{ matrix.prop }} > assets/fx/props/blender_${{ matrix.prop }}.log 2>&1 || true
          grep -E "rendered|Error|Traceback|line [0-9]" assets/fx/props/blender_${{ matrix.prop }}.log | tail -20
          d=assets/fx/props/${{ matrix.prop }}_frames
          ls $d | wc -l
          ffmpeg -y -loglevel error -framerate 25 -pattern_type glob -i "$d/*.jpg" -c:v libx264 -preset slow -crf 20 -pix_fmt yuv420p assets/fx/props/${{ matrix.prop }}.mp4
          test -s assets/fx/props/${{ matrix.prop }}.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "prop-${{ matrix.prop }}", path: "assets/fx/props/${{ matrix.prop }}.mp4\nassets/fx/props/blender_${{ matrix.prop }}.log"}
  save:
    needs: render
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: "prop-*", path: assets/fx/props, merge-multiple: true}
      - run: |
          ls -la assets/fx/props
          git config user.name Claude && git config user.email noreply@anthropic.com
          mkdir -p logs && mv assets/fx/props/blender_*.log logs/ 2>/dev/null || true
          git add -f assets/fx/props/*.mp4 logs/blender_*.log 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Blender: 3D money props"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
