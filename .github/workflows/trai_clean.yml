name: archived-card-preview
on:
  workflow_dispatch:
concurrency:
  group: bakra-clean-trai-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /build_trai_visuals.py
            /render_trai_clean.py
            /telegram.py
            /talk_test.py
            /fonts/Poppins-Bold.ttf
      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libraqm0
          python3 -m pip install -q --break-system-packages numpy pillow pymupdf
      - uses: actions/download-artifact@v4
        with:
          name: st_in
          path: st_in
          run-id: 41687899446
          github-token: ${{ github.token }}
      - name: Render clean scenes with existing Gemini narration
        run: python3 render_trai_clean.py
      - name: Validate archived preview without delivery
        run: ffmpeg -v error -i bakra_news_trai_final.mp4 -f null -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-clean-video
          path: |
            bakra_news_trai_final.mp4
            trai_clean_preview.jpg
            trai_clean_quality.json
          retention-days: 7
