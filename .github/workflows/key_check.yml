name: Key check (sirf naam, value nahi)
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-24.04
    steps:
      - env:
          K1: ${{ secrets.GEMINI_API_KEY }}
          K2: ${{ secrets.GEMINI_API_KEY2 }}
          K3: ${{ secrets.GEMINI_API_KEY3 }}
          K4: ${{ secrets.GEMINI_API_KEY4 }}
          K5: ${{ secrets.GEMINI_API_KEY5 }}
          K6: ${{ secrets.GEMINI_API_KEY6 }}
          K7: ${{ secrets.GEMINI_API_KEY_4 }}
          K8: ${{ secrets.GEMINI_KEY4 }}
          K9: ${{ secrets.GEMINI_API_KEY_NEW }}
        run: |
          for n in 1 2 3 4 5 6 7 8 9; do v="K$n"; v="${!v}"; [ -n "$v" ] && echo "K$n mili (lambai ${#v})" || echo "K$n khali"; done
          for n in 1 2 3 4 5 6 7 8 9; do v="K$n"; v="${!v}"; [ -z "$v" ] && continue
            c=$(curl -s -o /dev/null -w "%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models?key=$v"); echo "K$n jaanch: $c"; done
