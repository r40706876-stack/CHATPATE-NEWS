name: Postal naya kanoon (2024) -> pehle/ab register
on:
  workflow_dispatch:
    inputs:
      calls:
        default: "40"
permissions:
  contents: read
concurrency:
  group: postal-law
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Sarkari PDF lo
        run: |
          mkdir -p law raw
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          get(){ curl -sSL -A "$UA" --max-time 120 -o "raw/$1.pdf" "$2" && file "raw/$1.pdf" | grep -qi pdf && pdftotext -layout "raw/$1.pdf" "raw/$1.txt" && echo "OK $1 $(wc -c < raw/$1.txt)" || echo "FAIL $1"; }
          get regs "https://thc.nic.in/Central%20Governmental%20Regulations/Office%20Regulations,2024.pdf"
          get act "https://indiacode.nic.in/bitstream/123456789/20064/1/a2023-43.pdf"
          get ip1 "https://www.indiapost.gov.in/api/documents/file/U2FsdGVkX1-giP0QIqjpCUsSgJ4j5T6bZwMMK_X44XJAOqatakx_eolWkcl8TgOymtsKqc_L-4K82V_C8-heew"
          get ip2 "https://www.indiapost.gov.in/api/documents/file/U2FsdGVkX18tGe_rwRzdjlBbX5ugLcv2IO8HD9pF_LPaLJxTBKgP3QLGNGvKCXczx7w23umql1WDvczmqD4kkw"
          for f in raw/*.txt; do
            h=$(head -c 6000 "$f")
            if echo "$h" | grep -qi "Post Office Regulations"; then n=Post_Office_Regulations_2024
            elif echo "$h" | grep -qi "Post Office Rules"; then n=Post_Office_Rules_2024
            elif echo "$h" | grep -qi "Post Office Act"; then n=Post_Office_Act_2023
            else n=$(basename "$f" .txt); fi
            [ -s "law/$n.txt" ] || cp "$f" "law/$n.txt"
          done
          ls -la law; for f in law/*.txt; do echo "== $f"; head -c 400 "$f" | tr '\n' ' '; echo; done
      - uses: actions/upload-artifact@v4
        with:
          name: law
          path: law

  register:
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -q requests pypdf pillow numpy
      - uses: actions/download-artifact@v4
        with:
          name: law
          path: law
      - name: Badlaav nikalo
        run: |
          case "${{ matrix.shard }}" in
            0) export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" ;;
            1) export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY2 }}" ;;
            *) export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY3 }}" ;;
          esac
          SHARD=${{ matrix.shard }} NSHARD=3 LAW_MAX_CALLS=${{ inputs.calls || '40' }} python deep/law_register.py law lr_${{ matrix.shard }}.json 2>&1 | tail -n 60
          [ -f lr_${{ matrix.shard }}.json ] || echo "{}" > lr_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: lr${{ matrix.shard }}
          path: lr_${{ matrix.shard }}.json

  save:
    needs: [fetch, register]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          path: bk
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: postal-law branch par
        run: |
          mkdir o && cp -r dl/law o/law && cp dl/lr*/lr_*.json o/ 2>/dev/null || true
          cd o && python3 - <<'PY'
          import json, glob
          r = {}
          for f in glob.glob("lr_*.json"):
              r.update(json.load(open(f, encoding="utf-8")))
          items = [x for v in r.values() for x in v]
          json.dump(items, open("law_register.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print("kul badlaav:", len(items))
          PY
          git init -q && git checkout -q -b postal-law
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "naya kanoon register (run ${{ github.run_id }})"
          git remote add origin "$(git -C ../bk remote get-url origin)"
          git -c http.extraheader="$(git -C ../bk config --get http.https://github.com/.extraheader)" push -qf origin HEAD:postal-law
