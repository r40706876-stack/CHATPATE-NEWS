name: Postal actual website demo voice
on:
  push:
    branches: [codex/postal-real-demo-20261116]
    paths: [postal_real_demo/**, .github/workflows/postal_real_demo.yml]
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: production
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          path: core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -q requests pypdf pillow numpy edge-tts
      - name: Short narration
        working-directory: core
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_TTS_VOICE: Charon
          GEMINI_TTS_GENDER: male
          GEMINI_TTS_STYLE: 'Professional Hindi male teacher. Brisk and clear reel delivery. Read exactly the supplied script, no extra words, no long pauses.'
          VOICE_SPEEDUP: '1.0'
        run: python -u ../production/postal_real_demo/voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: Postal-Real-Demo-Voice
          path: core/demo_out/real_demo/
          retention-days: 14
