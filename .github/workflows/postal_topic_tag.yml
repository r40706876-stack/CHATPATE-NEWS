name: Postal sawal syllabus ke hisse me (topic tag)
# Dono bade notes PDF (scan + toota Hindi font) -> page-dar-page saaf text (deep/notes_ocr.py).
# Nateeja: core repo branch 'postal-tg' -> notes_text.json (deep vishleshan ka saboot). Dobara chalao to bache page.
on:
  workflow_dispatch:
    inputs:
      calls:
        description: "har key par kitne page"
        default: "45"
permissions:
  contents: read
  actions: write
concurrency:
  group: postal-topic-tag
  cancel-in-progress: false
jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null; pip install -q requests pypdf pillow numpy
      - name: Pichhla padha hua lo
        run: |
          git fetch -q origin postal-tg 2>/dev/null && git show FETCH_HEAD:tg_${{ matrix.shard }}.json > tg_${{ matrix.shard }}.json 2>/dev/null || rm -f tg_${{ matrix.shard }}.json
      - name: Padho
        run: |
          case "${{ matrix.shard }}" in
            0) export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" ;;
            1) export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY2 }}" ;;
            2) export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY3 }}" ;;
            *) export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY4 }}" ;;
          esac
          SHARD=${{ matrix.shard }} NSHARD=4 TAG_MAX_CALLS=${{ inputs.calls || '120' }} python deep/topic_tag.py tg_${{ matrix.shard }}.json 2>&1 | tail -n 60
          [ -f tg_${{ matrix.shard }}.json ] || echo "{}" > tg_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: tg${{ matrix.shard }}
          path: tg_${{ matrix.shard }}.json

  save:
    needs: ocr
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          path: bk
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: postal-tg branch par rakho
        run: |
          mkdir o && cp dl/tg_*.json o/ && cd o && python3 - <<'PY'
          import json, glob
          t = {}
          for f in sorted(glob.glob("tg_*.json")):
              t.update(json.load(open(f, encoding="utf-8")))
          json.dump(dict(sorted(t.items(), key=lambda kv: kv[0])),
                    open("tg_done.json", "w", encoding="utf-8"), ensure_ascii=False, indent=0)
          print("kul:", len(t))
          PY
          git init -q && git checkout -q -b postal-tg
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "topic tag (run ${{ github.run_id }})"
          git remote add origin "$(git -C ../bk remote get-url origin)"
          prev=$(git -C ../bk fetch -q origin postal-tg 2>/dev/null && git -C ../bk show FETCH_HEAD:tg_done.json 2>/dev/null | python3 -c "import json,sys;print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
          now=$(python3 -c "import json;print(len(json.load(open('tg_done.json'))))")
          tot=$(python3 -c "import json;print(sum(1 for f in ('pyq_bank','hard_bank','fact_mcq') for x in json.load(open('../bk/pyq_papers/'+f+'.json'))['items'] if (x.get('sec') or 'postal')=='postal'))")
          echo "pehle $prev, ab $now, kul $tot"
          if [ "$now" -gt "$prev" ] && [ "$now" -lt "$tot" ]; then echo 1 > ../cont.txt; fi
          git -c http.extraheader="$(git -C ../bk config --get http.https://github.com/.extraheader)" push -qf origin HEAD:postal-tg
      - name: Kaam baaki ho to agla daur khud chalao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run postal_site_refresh.yml -R ${{ github.repository }} || true   # nateeje website par
          if [ -f cont.txt ]; then gh workflow run postal_topic_tag.yml -R ${{ github.repository }} -f calls=250 && echo "agla daur shuru"; fi
