name: Bakra Blender 3D COD proof
on:
  workflow_dispatch:
  push:
    paths:
      - blender_cod_scene.py
      - .github/workflows/bakra-blender-3d.yml
permissions:
  contents: read
  actions: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        timeout-minutes: 28
        shell: bash
        run: |
          set -euo pipefail
          # Match the working portable Blender setup from Animation-special-.
          if ! command -v blender >/dev/null; then
            mkdir -p "$RUNNER_TEMP/blender"
            if timeout --signal=TERM --kill-after=15s 600s curl -fL --retry 3 --retry-delay 3 --connect-timeout 25 \
              -o "$RUNNER_TEMP/blender.tar.xz" \
              "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz" &&
              tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1 &&
              test -x "$RUNNER_TEMP/blender/blender"; then
              echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
              export PATH="$RUNNER_TEMP/blender:$PATH"
            else
              echo "::warning::Portable Blender unavailable; use bounded Ubuntu fallback"
              sudo sed -i 's@azure.archive.ubuntu.com@archive.ubuntu.com@g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
              timeout 180s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=25 update -qq
              timeout 720s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender
            fi
          fi
          if ! command -v xvfb-run >/dev/null || ! ldconfig -p | grep -q 'libEGL.so.1'; then
            sudo sed -i 's@azure.archive.ubuntu.com@archive.ubuntu.com@g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
            timeout 180s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=25 update -qq
            timeout 300s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libopengl0
          fi
          if ldd "$(command -v blender)" | grep 'not found'; then
            echo "::error::Blender runtime libraries missing"
            exit 1
          fi
          # Avoid the 2026-10-27 Azure apt mirror stall (proof run 40552118824:
          # FFmpeg dependency download exhausted the 300-second timeout).
          # Prefer the runner's binary, then a small pip-provided static FFmpeg.
          if ! command -v ffmpeg >/dev/null; then
            python3 -m pip install -q --disable-pip-version-check --break-system-packages imageio-ffmpeg
            ffmpeg_path="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            test -x "$ffmpeg_path"
            sudo ln -sf "$ffmpeg_path" /usr/local/bin/ffmpeg
          fi
          command -v ffmpeg >/dev/null || { echo "::error::FFmpeg unavailable"; exit 1; }
          blender --version | head -n 2
          ffmpeg -version | head -n 1
      - name: Render actual 3D COD animation
        timeout-minutes: 25
        run: |
          set -o pipefail
          mkdir -p blender_output
          BLENDER_OUTPUT="$PWD/blender_output/bakra_cod_3d.mp4" xvfb-run -a blender -b -t 2 --python blender_cod_scene.py 2>&1 | tee blender_output/blender_render.log
          test -s blender_output/bakra_cod_3d.mp4
          ffmpeg -v error -xerror -i blender_output/bakra_cod_3d.mp4 -f null -
          ffmpeg -y -loglevel error -ss 2 -i blender_output/bakra_cod_3d.mp4 -frames:v 1 blender_output/preview.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: bakra-original-blender-cod-3d
          path: blender_output/
          if-no-files-found: error

      - name: Queue integrated Bakra News episode after verified 3D render
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run talk_episode.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f script=episodes/waiting_ticket_comedy.json
          echo "3D proof verified and integrated comedy episode queued"
