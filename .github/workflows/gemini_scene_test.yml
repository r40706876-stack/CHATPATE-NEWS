name: Gemini scene test (chitra code ki aukaat)
# 2026-11-27: Demo 1 ke 3 drishya Gemini se code me banwa kar frame/mp4 -> postal-wala-core branch gemini-scene-test
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model (khaali = sabse accha apne aap)"
        default: ""
  push:
    branches: [main]
    paths: ['.github/workflows/gemini_scene_test.yml', 'oneoffs/gemini_scene_test/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core
          pip install requests playwright==1.47.0 && python -m playwright install --with-deps chromium
      - name: Test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_TTS_KEYS: ${{ secrets.GEMINI_API_KEY3 }},${{ secrets.GEMINI_API_KEY4 }},${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: cd oneoffs/gemini_scene_test && python run.py
      - name: Save
        if: always()
        run: |
          cd oneoffs/gemini_scene_test/out && git init -q && git checkout -q -b t
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "gemini scene test run ${{ github.run_id }}" && git push -f "https://x-access-token:${{ secrets.CORE_TOKEN }}@github.com/r40706876-stack/postal-wala-core.git" t:gemini-scene-test
