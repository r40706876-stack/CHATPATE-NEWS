name: Postal mock reel demo (4 Gemini key, TTS)
# Mock reel ka demo (post nahi): core repo mock_reel.py build --id X. Awaaz ke liye chaaron key baari-baari (TTS quota).
on:
  workflow_dispatch:
    inputs:
      demo:
        description: "sawal id (mock_tpl30/manual/<id>.json ho to 30 sec haath ki script)"
        default: "transit_mo"
permissions:
  contents: read
concurrency:
  group: postal-mock-demo
  cancel-in-progress: false
jobs:
  reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-freefont-ttf >/dev/null
          pip install playwright==1.47.0 numpy requests pypdf pillow edge-tts faster-whisper >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Reel banao
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_TTS_KEYS: ${{ secrets.GEMINI_API_KEY3 }},${{ secrets.GEMINI_API_KEY2 }},${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
          GEMINI_TTS_VOICE: hi-in-training-1
          GEMINI_TTS_STYLE: "lively elder-brother teacher: warm, clear and expressive with natural ups and downs - curious on questions, firm and serious on warnings, happy on answers, calm on examples; small natural pauses"
        run: python mock_reel.py build --id "${{ inputs.demo }}"
      - name: Core me rakho
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mock_reels
          git diff --cached --quiet || git commit -m "Mock reel demo [skip ci]"
          git pull --rebase -q origin main && git push
