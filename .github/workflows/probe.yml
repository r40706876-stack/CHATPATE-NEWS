# जाँच के लिए: कोई python command चलाओ, output repo में (probe.log)
name: probe
on:
  workflow_dispatch:
    inputs:
      cmd: {description: "python -c वाला code", default: "print(1)"}
env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
  GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  YT_COOKIES: ${{ secrets.YT_COOKIES }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          /usr/bin/python3 -m pip install -q --break-system-packages numpy scipy pillow "yt-dlp[default]" || true
          timeout 120 sh -c "curl -fsSL https://deno.land/install.sh | sh -s -- -y" >/dev/null 2>&1 || true; export PATH=$HOME/.deno/bin:$PATH   # YouTube के JS challenge के लिए
          date > probe.log; timeout 1200 /usr/bin/python3 -u probe_task.py >> probe.log 2>&1 || echo "रुका/समय ख़त्म: $?" >> probe.log; date >> probe.log
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f probe.log episodes/*.json memes 2>/dev/null; git commit -m probe && for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 3; done
