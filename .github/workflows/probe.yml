# जाँच के लिए: कोई python command चलाओ, output repo में (probe.log)
name: probe
on:
  workflow_dispatch:
    inputs:
      cmd: {description: "python -c वाला code", default: "print(1)"}
env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
  GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  YT_COOKIES: ${{ secrets.YT_COOKIES }}
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          /usr/bin/python3 -m pip install -q --break-system-packages numpy scipy pillow
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1; export PATH=$HOME/.deno/bin:$PATH   # YouTube के JS challenge के लिए
          /usr/bin/python3 probe_task.py > probe.log 2>&1 || true
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f probe.log episodes/*.json 2>/dev/null; git commit -m probe && for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 3; done
