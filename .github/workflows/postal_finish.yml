name: Postal bache sawal ka vishleshan (GK/ganit + daak)
# Bache sawal: pehle GK/ganit/reasoning/computer/English, fir daak ke bache (deep/finish_explain.py).
# Nateeja: core repo branch 'postal-fin' -> fin_done.json. Chaaron key; kaam baaki ho to khud agla daur; roz quota par fir.
on:
  schedule:
    - cron: '41 8 * * *'     # Gemini quota naya hone ke baad (14:01 IST) roz, jab tak kaam baaki
  workflow_dispatch:
    inputs:
      calls:
        description: "har key par kitni AI calls"
        default: "400"
permissions:
  contents: read
  actions: write
concurrency:
  group: postal-finish
  cancel-in-progress: false
jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null; pip install -q requests pypdf pillow numpy
      - name: Pichhla padha hua lo
        run: |
          git fetch -q origin postal-fin 2>/dev/null && git show FETCH_HEAD:fin_${{ matrix.shard }}.json > fin_${{ matrix.shard }}.json 2>/dev/null || rm -f fin_${{ matrix.shard }}.json
      - name: Padho
        run: |
          case "${{ matrix.shard }}" in
            0) export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" ;;
            1) export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY2 }}" ;;
            2) export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY3 }}" ;;
            *) export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY4 }}" ;;
          esac
          SHARD=${{ matrix.shard }} NSHARD=4 FIN_MAX_CALLS=${{ inputs.calls || '400' }} python deep/finish_explain.py fin_${{ matrix.shard }}.json 2>&1 | tail -n 60
          [ -f fin_${{ matrix.shard }}.json ] || echo "{}" > fin_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: fin${{ matrix.shard }}
          path: fin_${{ matrix.shard }}.json

  save:
    needs: ocr
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: r40706876-stack/postal-wala-core
          token: ${{ secrets.CORE_TOKEN }}
          path: bk
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: postal-fin branch par rakho
        run: |
          mkdir o && cp dl/fin_*.json o/ && cd o && python3 - <<'PY'
          import json, glob
          t = {}
          for f in sorted(glob.glob("fin_*.json")):
              t.update(json.load(open(f, encoding="utf-8")))
          json.dump(dict(sorted(t.items(), key=lambda kv: kv[0])),
                    open("fin_done.json", "w", encoding="utf-8"), ensure_ascii=False, indent=0)
          print("kul:", len(t), "vishleshan:", sum(1 for v in t.values() if not v.get("fail")))
          PY
          git init -q && git checkout -q -b postal-fin
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "bache vishleshan (run ${{ github.run_id }})"
          git remote add origin "$(git -C ../bk remote get-url origin)"
          prev=$(git -C ../bk fetch -q origin postal-fin 2>/dev/null && git -C ../bk show FETCH_HEAD:fin_done.json 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d)+sum(1 for v in d.values() if not v.get('fail')))" 2>/dev/null || echo 0)
          now=$(python3 -c "import json;d=json.load(open('fin_done.json'));print(len(d)+sum(1 for v in d.values() if not v.get('fail')))")
          tot=999999
          echo "pehle $prev, ab $now, kul $tot"
          if [ "$now" -gt "$prev" ] && [ "$now" -lt "$tot" ]; then echo 1 > ../cont.txt; fi
          git -c http.extraheader="$(git -C ../bk config --get http.https://github.com/.extraheader)" push -qf origin HEAD:postal-fin
      - name: Kaam baaki ho to agla daur khud chalao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run postal_site_refresh.yml -R ${{ github.repository }} || true   # nateeje website par
          if [ -f cont.txt ]; then gh workflow run postal_finish.yml -R ${{ github.repository }} -f calls=400 && echo "agla daur shuru"; fi
